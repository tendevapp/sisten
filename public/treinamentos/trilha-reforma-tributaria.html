/* ===================== SISTEN: casca e ajustes ===================== */
body{background:var(--bg);font-family:'Inter',Arial,sans-serif}
h1,h2,h3,h4{font-family:'Archivo','Inter',sans-serif}
.rt-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 24px;background:var(--k-fff);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rt-brand{display:flex;align-items:center;gap:10px;min-width:0}
.rt-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#10b981,#0f766e);color:#fff;display:grid;place-items:center;font:700 17px 'Archivo',sans-serif;flex:none}
.rt-brand b{display:block;font:700 16px/1.15 'Archivo',sans-serif;color:var(--ink)}
.rt-brand small{display:block;font-size:11px;color:var(--muted)}
.rt-tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--k-f3f7f9);margin-left:auto;overflow-x:auto;scrollbar-width:none}
.rt-tabs button{border:0;background:transparent;color:var(--muted);font:600 13px 'Inter',sans-serif;padding:7px 14px;border-radius:9px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rt-tabs button:hover{color:var(--ink)}
.rt-tabs button.active{background:var(--k-fff);color:var(--blue);box-shadow:0 1px 2px #0f172a1f}
.rt-ok{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:10px}
.rt-prog{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.rt-prog .rt-track{width:90px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.rt-prog .rt-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#f97316);border-radius:99px;transition:width .6s}
main#main{padding:22px 24px 30px;max-width:1720px;margin:0 auto;min-height:0}
.rt-foot{max-width:1720px;margin:0 auto;padding:0 24px 24px;font-size:12px;color:var(--muted)}
.rt-done:disabled{cursor:default;opacity:1}
/* Cabeçalho fixo: o que é rolado até a vista não fica escondido embaixo dele. */
[id],.comparison-docs,.quote-maps{scroll-margin-top:72px}
.textlink{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
/* As duas NFs ocupam a altura da janela: dá para ler e comparar sem rolar a página. */
.invoice-window{height:clamp(420px,calc(100vh - 300px),920px)}
/* Mapas de cotação lado a lado, como as duas NFs */
.quote-maps{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.quote-map{display:flex;flex-direction:column}
.quote-map .tablewrap{flex:1;overflow-x:auto;overflow-y:visible;overscroll-behavior:auto}
.quote-map .pane-heading{padding:14px 16px}
.quote-map .pane-heading h2{font-size:22px}
.q-pane-total{text-align:right}
.q-pane-total small{display:block;font-size:10px;color:var(--muted)}
.q-pane-total b{font:600 19px 'Archivo',sans-serif;color:var(--ink)}
.quote-map:last-child .q-pane-total b{color:var(--blue)}
.quote-table{min-width:0;font-size:13px;line-height:1.5}
.quote-table td,.quote-table th{font-size:13px;padding:9px 11px}
.quote-table button{font-size:13px;line-height:1.35}
.quote-table thead button{font-size:14px}
.quote-table small{font-size:11px;margin-top:3px}
.quote-table .badge{font-size:11px}
.quote-table .cost-row td{font-size:15px}
.quote-table .cost-row button{font-size:13px}
.quote-table th:first-child,.quote-table td:first-child{width:34%}
.quote-table th:not(:first-child){width:22%}
.quote-table td.q-changed{background:var(--k-fff7dc);box-shadow:inset 0 -2px var(--k-e3bc3c)}
.quote-table tbody td[title]{cursor:help}
.quote-table .best-cell{background:#dcfce7 !important;color:#14532d !important;font-weight:800 !important;position:relative;box-shadow:inset 0 0 0 2px #16a34a,0 2px 8px #16a34a26 !important}
.quote-table .best-cell:after{content:'★ Menor custo';font-size:10px;font-weight:700;color:#14532d;display:inline-block;background:#bbf7d0;padding:2px 7px;border-radius:99px;margin-top:4px;border:1px solid #86efac}
.quote-table th.winner-vendor{background:#f0fdf4;border-top:3px solid #16a34a}
.winner-badge{display:inline-block;background:#16a34a;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin:3px 0 2px;letter-spacing:0.02em}
@media (prefers-color-scheme:dark){

function compareCellKey(label){

function quoteModel(v,c,y,options=quoteState){
 const raw=round(c.qty*v.unit+v.freight-v.discount);const invalid=raw<=0||v.discount>c.qty*v.unit+v.freight;
 const icms2026=c.kind==='service'||c.benefit||v.regime!=='regular'?0:qIcmsV(v,c);const iss2026=c.kind==='service'&&v.regime==='regular'?v.iss:0;
 const debitIcms2026=round(raw*icms2026/100),debitIss2026=round(raw*iss2026/100);const pcBase=round(raw-debitIcms2026),pis=round(pcBase*.0165),cof=round(pcBase*.076);
 const net=v.regime==='regular'?round(raw-debitIcms2026-debitIss2026-pis-cof):raw;
 let total=raw,base=net,icms=debitIcms2026,iss=debitIss2026,cbs=0,ibs=0,creditPC=round(pis+cof),creditIcms=debitIcms2026,creditCbs=0,creditIbs=0,rateI=icms2026;
 if(y===2026){if(v.regime==='regular'){cbs=round(net*.009);ibs=round(net*.001)}}
 else{creditPC=0;
  if(v.regime==='das'){total=raw;icms=iss=creditIcms=0;{const d=qDasCredito(v,c,y,raw);creditCbs=d.cbs;creditIbs=d.ibs}}
  else{
   rateI=v.regime==='regular'&&c.kind==='goods'?qIcmsV(v,c)*YEARS[y].legacy/100:0;
   if(c.benefit&&y<=2028)rateI=0;
   const rateS=c.kind==='service'&&v.regime==='regular'?v.iss*YEARS[y].legacy/100:0;
   const grossLegacy=round(net/(1-(rateI+rateS)/100));icms=rateI?round(grossLegacy-net):0;iss=rateS?round(grossLegacy-net):0;
   cbs=round(net*YEARS[y].cbs/100);ibs=round(net*YEARS[y].ibs/100);total=round(grossLegacy+cbs+ibs);creditIcms=icms;creditCbs=cbs;creditIbs=ibs;base=grossLegacy;
  }
 }
 // ICMS do fornecedor do Simples (bens): parte de ICMS do DAS dele (qDasIcms); o ISS do prestador do Simples não gera crédito.
 if(v.regime==='das')creditIcms=qDasIcms(v,c,y,raw);else if(v.regime!=='regular')creditIcms=0;
 const allowed=options.credit&&v.docs;
 if(!allowed){creditPC=creditIcms=creditCbs=creditIbs=0}
 const credits=round(creditPC+creditIcms+creditCbs+creditIbs),landed=round(total+v.extra),economic=round(landed-credits);
 const rate=options.monthly/100;const payablePV=round(total/Math.pow(1+rate,v.pay/30)),creditsPV=round(credits/Math.pow(1+rate,(v.pay+options.creditDays)/30));
 const present=round(payablePV-creditsPV+v.extra),score=options.pv?present:economic;

 return{raw,net,base,total,icms,iss,cbs,ibs,creditPC,creditIcms,creditCbs,creditIbs,credits,landed,economic,present,score,issues,eligible:issues.length===0,rateI,pcBase,pis,cof,payablePV,creditsPV};
}

function qMap(y){const c=qCase(),models=qModels(y),winner=qWinner(y),outroAno=y===2026?quoteState.year:2026,outros=qModels(outroAno),muda=(i,key)=>outroAno!==y&&(key==='extra'?false:Math.abs((models[i].m[key]||0)-(outros[i].m[key]||0))>=.01);return `<section class="quote-map"><div class="pane-heading"><div><span>${y===2026?'Como comprar hoje':'Cenário da reforma'}</span><h2>Mapa de cotação · ${y}</h2></div><div class="q-pane-total"><small>${y===2026?'Hoje':'Ano selecionado'} · menor custo</small><b>${winner?money(winner.m.score):'—'}</b></div></div><div class="tablewrap"><table class="datatable quote-table"><thead><tr><th>Mesmo lote, mesma entrega</th>${models.map(({v,m})=>`<th class="${v.id===quoteState.focus?'focused-vendor':''} ${winner?.ties.includes(v.id)?'winner-vendor':''}"><button data-q-focus="${v.id}">${v.name} ↗</button>${winner?.ties.includes(v.id)?'<span class="winner-badge">★ Menor custo</span>':''}<small>${v.uf} · ${v.regime==='das'?'Simples / DAS':v.regime==='outside'?'Simples / IBS-CBS regular':'Regime regular'}</small></th>`).join('')}</tr></thead><tbody><tr><td>Quantidade de itens</td>${models.map(()=>`<td title="Memória de cálculo:\nQuantidade do lote solicitada na requisição de compra: ${num(c.qty,0)} ${c.unit} (${c.destination})"><b>${num(c.qty,0)}</b> ${c.unit}</td>`).join('')}</tr><tr><td>Preço unitário da referência 2026</td>${models.map(({v})=>`<td title="Memória de cálculo:\nPreço unitário cotado em 2026: ${money(v.unit)} por ${c.unit}\nValor do lote (${num(c.qty,0)} ${c.unit}): ${money(c.qty*v.unit)} (tributos legados incluídos)">${money(v.unit)}<small>Tributos legados incluídos</small></td>`).join('')}</tr><tr><td>Frete cobrado na referência 2026</td>${models.map(({v})=>`<td title="Memória de cálculo:\nFrete cobrado pelo fornecedor na proposta: ${money(v.freight)}">${money(v.freight)}</td>`).join('')}</tr><tr><td>Desconto incondicional na referência</td>${models.map(({v})=>`<td title="Memória de cálculo:\nDesconto comercial incondicional no valor do lote: ${money(v.discount)}">${money(v.discount)}</td>`).join('')}</tr>${QUOTE_METRICS.filter(([key])=>quoteState.detailedRows||['total','creditIcms','creditPC','creditCbs','creditIbs','economic','present'].includes(key)).map(([key,label])=>`<tr class="${key===quoteState.metric?'metric-active':''} ${key==='economic'?'cost-row':''}"><td><button data-q-metric="${key}">${label} ↗</button></td>${models.map(({v,m},i)=>`<td class="${winner?.ties.includes(v.id)&&key===(quoteState.pv?'present':'economic')?'best-cell':''} ${muda(i,key)?'q-changed':''}" title="${esc((muda(i,key)?`[${y===2026?'Muda em '+outroAno:'Mudou em relação a 2026'}]\n\n`:'')+qMemo(v,m,key,y,c))}">${money(key==='extra'?v.extra:m[key])}</td>`).join('')}</tr>`).join('')}<tr><td>Entrega / pagamento</td>${models.map(({v})=>`<td title="Prazos comerciais da proposta:\n• Prazo de entrega: ${v.delivery} dias corridos\n• Prazo para pagamento: ${v.pay} dias">${v.delivery} / ${v.pay} dias</td>`).join('')}</tr><tr><td>Comparável no exercício?</td>${models.map(({m})=>`<td title="${m.eligible?'Proposta comparável e regular:\n• Especificação técnica equalizada\n• Premissas fiscais confirmadas\n• Entrega dentro do prazo de necessidade':'Pendências identificadas:\n• '+m.issues.join('\n• ')}"><span class="badge ${m.eligible?'green':'red'}">${m.eligible?'Sim':'Pendência'}</span><small>${m.issues.join('; ')||'Escopo, prazo e premissa fiscal confirmados.'}</small></td>`).join('')}</tr></tbody></table></div><div class="q-map-result">${winner?`<b>★ ${winner.ties.length>1?'Empate econômico no exercício':winner.v.name}</b><span>${winner.ties.length>1?'Não há fornecedor único indicado pelos valores.':`Menor ${quoteState.pv?'custo em valor presente':'custo após créditos'} entre propostas comparáveis: ${money(winner.m.score)}.`}</span>`:'<b>Nenhuma proposta comparável.</b><span>Resolver as pendências antes da escolha.</span>'}</div></section>`}
function qField(key,label,value,kind='number',step='0.01'){return `<label class="field">${label}<input type="${kind}" data-q-key="${key}" value="${esc(value)}" ${kind==='number'?`min="0" max="100000000" step="${step}"`:''}></label>`}
function qEditors(){return `<details class="quote-editors"><summary>Editar as três propostas e testar a decisão</summary><p>Valores do lote original de 2026, em reais, com tributos legados incluídos. O portal projeta os anos futuros preservando o preço líquido estimado do fornecedor regular. É uma hipótese de negociação; uma cotação futura real pode ter outro preço.</p><div class="grid3">${quoteState.vendors.map(v=>`<fieldset class="q-vendor-editor" data-q-editor="${v.id}"><legend>${v.name}</legend><div class="inputstack">${qField('unit','Preço unitário cotado em 2026',v.unit)}${qField('freight','Frete adicional cobrado pelo fornecedor',v.freight)}${qField('discount','Desconto incondicional no lote',v.discount)}${qField('extra','Outros custos não recuperáveis do lote',v.extra)}${qField('delivery','Entrega em dias',v.delivery,'number','1')}${qField('pay','Pagamento em dias',v.pay,'number','1')}<label class="field">Regime / opção para IBS-CBS<select data-q-key="regime"><option value="regular" ${v.regime==='regular'?'selected':''}>Regime regular</option><option value="das" ${v.regime==='das'?'selected':''}>Simples — IBS/CBS no DAS</option><option value="outside" ${v.regime==='outside'?'selected':''}>Simples — IBS/CBS fora do DAS</option></select></label>${qEditorImposto(v)}${v.regime==='das'?qEditorDas(v):''}<label class="q-check"><input type="checkbox" data-q-key="spec" ${v.spec?'checked':''}>Especificação equalizada</label><label class="q-check"><input type="checkbox" data-q-key="docs" ${v.docs?'checked':''}>Premissa fiscal confirmada no exercício</label></div><button class="btn outline small q-apply" data-q-apply="${v.id}">Aplicar alterações</button></fieldset>`).join('')}</div><p class="source">As opções do Simples são hipóteses para o período futuro. Alterar a opção exige negociar preço e conferir a situação efetiva; o portal não realiza opção tributária. O ICMS do fornecedor regular é calculado pelas UFs de origem e destino, e o crédito do fornecedor do Simples, pela partilha do DAS; o ISS segue como hipótese municipal (2% a 5%). Fora do DAS significa aqui apenas IBS/CBS no regime regular; demais tributos do Simples exigem análise própria.</p></details>`}
function qLesson(){const c=qCase(),v=quoteState.vendors.find(v=>v.id===quoteState.focus),a=quoteModel(v,c,2026),b=quoteModel(v,c,quoteState.year),key=quoteState.metric,metric=QUOTE_METRICS.find(m=>m[0]===key);return `<article class="comparison-lesson" id="quoteLesson"><div class="lesson-title"><span class="badge">Analise a linha do mapa</span><h2>${metric[1]}</h2><div class="beforeafter"><span>${v.name}</span><span>Hoje: <b>${money(key==='extra'?v.extra:a[key])}</b></span><span>→</span><span>${quoteState.year}: <b>${money(key==='extra'?v.extra:b[key])}</b></span></div></div><div class="teaching-grid"><div><h3>O que observar</h3><p>${metric[2]}</p></div><div><h3>Abra a conta deste fornecedor</h3><p>Hoje: ${money(a.total)} + ${money(v.extra)} − ${money(a.credits)} em créditos = <b>${money(a.economic)}</b>.</p><p>${quoteState.year}: ${money(b.total)} + ${money(v.extra)} − ${money(b.credits)} = <b>${money(b.economic)}</b>.</p><p>Preço líquido estimado de referência: ${money(b.net)}. ${v.regime==='das'?'No DAS, o preço bruto foi mantido, sem retirar dele um PIS/Cofins que o fornecedor não destacou.':'O ICMS/ISS remanescente é recomposto por dentro; IBS/CBS são calculados por fora.'}</p></div><div><h3>Como validar antes do pedido</h3><p>Solicitar composição do preço, regime e opção IBS/CBS, destino, classificação e fundamento. Confrontar com a requisição e manter a análise fiscal condicionada aos documentos válidos na entrada.</p></div></div></article>`}
function qDecision(){const chosen=quoteState.decision;if(!chosen)return '';const v=quoteState.vendors.find(v=>v.id===chosen),m=quoteModel(v,qCase(),quoteState.year),best=qWinner(quoteState.year);return `<div class="feedback" id="qDecisionFeedback" role="status"><b>${v.name}:</b> ${!m.eligible?'A proposta ainda não pode ser comparada: '+m.issues.join('; ')+'. Equalize antes de escolher.':best?.ties.includes(v.id)?'Sua escolha coincide com o menor custo do exercício, sob as premissas selecionadas. Registre a equalização técnica, validação Fiscal e condições comerciais antes de aprovar a compra.':`A proposta é comparável, mas ${best?best.v.name:'outra proposta'} tem menor custo no exercício. Se optar por ${v.name}, documente a razão técnica/comercial; menor preço ou maior crédito isoladamente não justifica a escolha.`}</div>`}
function quoteMaps(){const c=qCase(),now=qWinner(2026),future=qWinner(quoteState.year),same=now&&future&&now.ties.join()===future.ties.join();return `<div class="q-rule-strip"><div><span>Menor custo no exercício de hoje</span><b>${now?now.ties.length>1?'Empate':now.v.name:'Resolver pendências'}</b></div><span class="q-rule-arrow">→</span><div><span>Menor custo no exercício de ${quoteState.year}</span><b>${future?future.ties.length>1?'Empate':future.v.name:'Resolver pendências'}</b></div><div><span class="badge ${same?'green':'yellow'}">${same?'Mesma indicação':'A decisão pode mudar'}</span><small>Considera escopo, prazo, premissa fiscal e ${quoteState.pv?'valor presente':'custo após créditos'}. Não é aprovação de compra.</small></div></div><div class="q-map-jump"><button class="btn" id="qExplainChange">Entender a escolha passo a passo ↓</button><span>5 passos para conferir a conta e justificar a decisão</span></div><div class="q-assumptions"><label class="q-check"><input id="qCredit" type="checkbox" ${quoteState.credit?'checked':''}>Considerar créditos elegíveis da hipótese</label><label class="q-check"><input id="qPV" type="checkbox" ${quoteState.pv?'checked':''}>Comparar em valor presente</label><label class="field">Necessidade em dias<input type="number" id="qDeadline" value="${quoteState.deadline}" min="0" max="365" step="1"></label>${quoteState.pv?`<label class="field">Taxa econômica mensal (%)<input id="qMonthly" type="number" value="${quoteState.monthly}" min="0" max="20" step="0.1"></label><label class="field">Crédito aproveitado após pagamento (dias)<input id="qCreditDays" type="number" value="${quoteState.creditDays}" min="0" max="720" step="1"></label>`:''}<button class="btn outline small" id="qApplyConditions">Atualizar condições</button></div><label class="q-detail-toggle"><input type="checkbox" id="qDetailedRows" ${quoteState.detailedRows?'checked':''}>Mostrar composição completa dos tributos e custos</label><p class="q-read-hint">Os dois mapas ficam lado a lado, como as NFs: à esquerda hoje, à direita o ano escolhido. Valores que mudam entre os anos ficam destacados.</p><div class="quote-maps">${qMap(2026)}${qMap(quoteState.year)}</div><p class="source">Crédito não é desconto no boleto. Os nomes e propostas são fictícios. O caso presume TEN no regime não cumulativo e compras elegíveis; o direito e o prazo efetivo de aproveitamento dependem de validação Fiscal. No teste de 2026, IBS/CBS não reduzem o custo deste exercício.</p>${qMemoria()}${qWalkthrough()}${qEditors()}${qLesson()}${section('Sua decisão de compra','Escolha para treinar a justificativa. Nenhum pedido é emitido e nenhum fornecedor é contratado.')}<div class="q-choose">${quoteState.vendors.map(v=>`<button class="btn ${quoteState.decision===v.id?'':'outline'}" data-q-choose="${v.id}">Eu escolheria ${v.name}</button>`).join('')}</div>${qDecision()}`}
function quoteGuide(){return `<div class="grid2">${[
 ['Equalize antes de comparar','Confirme especificação, desenho/revisão, quantidade, unidade, embalagem, certificados e aprovação da Engenharia. Item similar não é automaticamente equivalente.','Requisição + proposta + ficha técnica.'],
 ['Peça o preço de forma comparável','Separe preço, frete, seguro, desconto incondicional, tributos por dentro/por fora, custos extras, prazo e validade. Para entrega futura, confirme o ano do faturamento.','Composição de preço e condição de entrega.'],
 ['Confirme regime e opção efetiva','Lucro Real/Lucro Presumido do fornecedor não determina sozinho o crédito do comprador. No Simples, conferir se IBS/CBS permanecem no DAS ou estão no regime regular.','Cadastro atualizado e comprovação da opção.'],
 ['Abra os créditos por tributo','Separe ICMS, PIS/Cofins, CBS e IBS. Não some crédito de teste como ganho de caixa nem presuma crédito cheio do DAS. Ativo/CIAP, consumo pessoal e exceções exigem análise própria.','Memória de crédito revisada pelo Fiscal.'],
 ['Compare custo, caixa e prazo','Total a pagar, custo após créditos e valor presente são medidas diferentes. Crédito sem expectativa de uso não pode ter o mesmo peso econômico de um crédito prontamente utilizável.','Mapa + projeção de pagamento e aproveitamento.'],
 ['Registre a decisão e confira na entrada','Selecionar menor custo é uma indicação sob premissas. Documente qualquer exceção técnica/comercial, confirme o contrato e revalide o XML, recebimento e requisitos de crédito na entrega.','Justificativa + aprovações + pedido + XML.']
 ].map(([t,d,e],i)=>`<article class="card q-guide"><span class="badge">Passo ${i+1}</span><h2>${t}</h2><p>${d}</p><p class="source"><b>Evidência:</b> ${e}</p></article>`).join('')}</div>${section('O que muda na lógica de Suprimentos')}<div class="card tablewrap"><table class="datatable"><thead><tr><th>Na comparação atual</th><th>Com a reforma</th><th>Pergunta ao fornecedor</th></tr></thead><tbody><tr><td>Origem, ICMS, benefício e PIS/Cofins afetam o crédito e o preço.</td><td>ICMS/ISS convivem na transição; IBS/CBS ganham importância, com destino e classificação próprios.</td><td>Qual é o tratamento por item e o local de entrega/execução?</td></tr><tr><td>Preço bruto menor pode esconder frete e diferenças de crédito.</td><td>Preço líquido, tributos por fora e crédito precisam aparecer separados.</td><td>Seu total já inclui IBS/CBS? Há cobrança adicional de frete?</td></tr><tr><td>Compra elegível de optante Simples pode gerar PIS/Cofins ao comprador não cumulativo.</td><td>Se IBS/CBS ficam no DAS, crédito limitado ao devido no regime, sujeito às condições legais.</td><td>Qual opção vale no período e qual valor de IBS/CBS é informado?</td></tr><tr><td>Pagamento e prazo de crédito já influenciam capital de giro.</td><td>Novos mecanismos de recolhimento e requisitos de crédito exigem maior conciliação.</td><td>Como documento, pagamento e crédito serão vinculados e comprovados?</td></tr></tbody></table></div>${section('Checklist antes de recomendar a compra')}<div class="card checklist">${['Mesma especificação e unidade, com conversão comprovada.','Entrega, prazo, validade, pagamento e custos adicionais equalizados.','Preço com/sem tributos e frete sem duplicidade.','Regime, opção IBS/CBS, destino e classificação validados.','Benefício vigente e crédito elegível sem dupla contagem.','Mapa e justificativa revisados pelas áreas responsáveis.'].map((t,i)=>`<label class="checkitem"><input type="checkbox" data-q-check="${i}" ${quoteState.checks.includes(i)?'checked':''}><span function quoteErrorLab(){const e=QUOTE_ERRORS[quoteState.error],answer=quoteState.answers[quoteState.error];return `<div class="tools"><label class="field">Situação para investigar<select id="qError">${QUOTE_ERRORS.map((e,i)=>`<option value="${i}" ${quoteState.error===i?'selected':''}>${e.title}</option>`).join('')}</select></label></div><div class="grid2"><article class="card challenge"><span class="badge yellow">Cotação para analisar · ${quoteState.error+1} de 8</span><h2 style="margin-top:16px">${e.title}</h2><blockquote class="q-offer">${e.offer}</blockquote><h3>Onde está o problema?</h3><div class="options">${e.options.map((t,i)=>`<button data-q-answer="${i}" class="option ${answer!==undefined?(i===e.answer?'correct':i===answer?'wrong':''):''}" ${answer!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${t}</button>`).join('')}</div>${answer!==undefined?`<div class="feedback" role="status"><b>${answer===e.answer?'Conferência correta.':'Revise a premissa.'}</b> ${e.explain}</div>`:''}<div class="stepnav"><button class="btn outline small" id="qRetry">Refazer esta situação</button><button class="btn small" id="qNextError">Próxima situação →</button></div></article><article class="card"><h2>Como investigar e encaminhar</h2><h3>Peça a evidência</h3><p>${answer!==undefined?e.evidence:'Responda à situação para revelar a evidência que falta e a orientação recomendada.'}</p>${answer!==undefined?`<h3>Oriente o fornecedor</h3><p>${e.action}</p><label class="field" for="qSupplierText">Modelo para adaptar</label><textarea class="template" id="qSupplierText">${esc(`Prezados, na equalização da cotação [número / revisão], item [item], identificamos a seguinte pendência: ${e.title.toLowerCase()}.\n\nSolicitamos: ${e.evidence}\n\n${e.action}\n\nFavor enviar composição revisada, fundamento e validade da proposta. O enquadramento será confirmado com nosso Fiscal antes da aprovação.\n\n[Nome / área / contato]`)}</textarea><button class="btn small" id="qCopySupplier">Copiar o frete cobrado pelo fornecedor − desconto incondicional = total do documento. Para o fornecedor regular, a estimativa de receita líquida retira ICMS, ISS e PIS/Cofins do cenário. O PIS/Cofins do exercício usa base sem ICMS destacado e alíquotas de 1,65% e 7,60%. Na compra do Simples, o crédito de PIS/Cofins do adquirente elegível é distinto do débito do fornecedor. O crédito de ICMS do fornecedor do Simples (bens) é a parte de ICMS do DAS dele, pela partilha do anexo e da faixa (LC 123, art. 23), e vai caindo na transição enquanto o IBS ocupa o lugar; o ISS pago no DAS não gera crédito.</p><p><b>2027–2033:</b> o fornecedor regular preserva o preço líquido estimado e recompõe ICMS/ISS remanescente por dentro. CBS/IBS são acrescidos por fora. As alíquotas futuras e a progressão são as hipóteses da apostila usadas no restante do portal. Isso não garante uma negociação real de preço nem certidão de direito ao crédito.</p><p><b>Fornecedor no DAS:</b> o preço bruto foi mantido. O crédito de CBS e IBS é <b>calculado</b>, não digitado: receita bruta dos últimos 12 meses do fornecedor → faixa do anexo → alíquota efetiva → parte de CBS e de IBS na partilha do ano (LC 123, anexos da reforma; limite do crédito na LC 214/2025, art. 47, § 9º, II). Anexo e receita de cada fornecedor são hipóteses dos exemplos, editáveis no editor das propostas; a Resolução CGSN 190/2026, que detalha o procedimento, não foi lida. Fator R, sublimites e a fórmula especial do ISS acima de 14,92537% na faixa 5 do Anexo III não são tratados. Ao simular IBS/CBS fora do DAS, o preço comercial bruto de referência passa a ser base negociada da hipótese, sem retirar PIS/Cofins que não foram destacados pelo fornecedor. Não é cálculo completo do Simples.</p><p><b>Valor presente:</b> taxa econômica mensal indicada pelo usuário, prazo de pagamento contado da mesma data de referência para todos e aproveitamento do crédito após esse pagamento. A aproximação não garante restituição, compensação imediata nem disponibilidade de caixa. Custos extras são lançados na data de referência.</p><p><b>Escopo:</b> não calcula automaticamente IPI, ST, DIFAL, importação, CIAP, retenções, regimes especiais ou benefício individual. Nenhum destes componentes deve ser presumido inexistente numa compra real. Para frete diretamente contratado, elaborar comparação própria; o campo deste mapa é frete cobrado pelo fornecedor. Não inclui aleatoriamente “risco tributário” como acréscimo de preço.</p><p><b>Indicação didática:</b> considera apenas propostas com escopo e premissa fiscal confirmados no exercício e entrega dentro do prazo. Empates não indicam vencedor único. A decisão real depende da avaliação técnica, comercial, Fiscal e da governança de aprovação.</p><p>${link('lc')} · ${link('pis')} · ${link('cofins')} · <a href="https://www8.receita.fazenda.gov.br/SimplesNacional/Arquivos/manual/PerguntaoSN.pdf" target="_blank" rel="noopener">Perguntas e Respostas do Simples, item 7.5 ↗</a> · <a href="https://www.gov.br/fazenda/pt-br/assuntos/noticias/2026/setembro/comecou-nesta-terca-1o-09-o-prazo-para-opcao-pelo-simples-nacional-e-para-a-escolha-do-modelo-de-recolhimento-do-ibs-e-da-cbs-em-2027/" target="_blank" rel="noopener">Opção IBS/CBS do Simples para 2027 ↗</a></p></details><div class="compare-next">${markButton(1)}</div>`}

function fiscalModel(s,year){
 const pc=s.simple?0:9.25;const icmsOld=round(s.price*s.icms/100),issOld=round(s.price*s.iss/100);const pcBase=s.price-icmsOld;const pisOld=round(pcBase*(pc?1.65:0)/100),cofOld=round(pcBase*(pc?7.6:0)/100);const net=round(s.price-icmsOld-issOld-pisOld-cofOld);
 let icms=icmsOld,iss=issOld,pis=pisOld,cof=cofOld,base=net,cbs=0,uf=0,mun=0,total=s.price,rateC=0,rateI=0,rateOld=s.icms,projection=false;
 if(year>=2026&&!s.simple){rateC=YEARS[year].cbs;rateI=YEARS[year].ibs;cbs=round(base*rateC/100);uf=round(base*rateI/100*(year===2026?1:.5));mun=round(base*rateI/100)-uf;
 if(year>2026){pis=cof=0;const mult=YEARS[year].legacy/100;rateOld=(s.benefit?(year<=2028?0:(s.origin===s.dest?20.5:7)):s.icms)*mult;const r=(s.iss?s.iss*mult:rateOld)/100;const legacyGross=round(net/(1-r));icms=s.iss?0:round(legacyGross-net);iss=s.iss?round(legacyGross-net):0;total=round(legacyGross+cbs+uf+mun);projection=true}}
 return{net,base,cbs,uf,mun,ibs:round(uf+mun),icms,iss,pis,cof,total,rateC,rateI,rateOld,projection,pcBase};
}

/* ===================== SISTEN: ICMS do fornecedor regular, calculado pelas UFs =====================
   A alíquota de ICMS deixou de ser digitada na proposta ("ICMS original hipotético"): sai da UF de origem do
   fornecedor e da UF de destino da compra (parte final de `destination`, ex.: "Jacobina / BA").
     • mesma UF → alíquota interna geral do estado (ICMS_INTERNA);
     • UFs diferentes → alíquota interestadual da Resolução do Senado 22/1989: 7% de Sul/Sudeste (exceto ES) para
       Norte, Nordeste, Centro-Oeste e ES; 12% nos demais fluxos. (Os 4% de importados não são tratados.)
   Não calcula benefício fiscal, diferimento, substituição tributária nem DIFAL: isso é decisão do caso (`benefit`).
   ISS não tem regra nacional (lei de cada município, entre 2% e 5%): continua sendo hipótese informada, agora
   com limite no editor. */
const ICMS_INTERNA={BA:20.5,SP:18,MG:18,ES:17}; /* alíquota interna geral; cadastrar o estado antes de usá-lo como destino */
const ICMS_SUL_SUDESTE=['SP','RJ','MG','PR','SC','RS'];
const qUfDestino=c=>(String(c.destination||'').match(/\/\s*([A-Z]{2})\s*$/)||[])[1]||'BA';
function qIcmsUF(v,c){
 const o=v.uf,d=qUfDestino(c);
 if(o===d){
  const t=ICMS_INTERNA[d],est=t===undefined;
  return{taxa:est?18:t,origem:o,destino:d,tipo:'interna',est,
   texto:est?`${o} → ${d}: operação interna; a alíquota interna de ${d} não está cadastrada, usados 18% como estimativa`:`${o} → ${d}: operação interna, alíquota geral de ${d} (${num(t,2)}%)`};
 }
 const ss=ICMS_SUL_SUDESTE.includes(o)&&!ICMS_SUL_SUDESTE.includes(d);
 return{taxa:ss?7:12,origem:o,destino:d,tipo:'interestadual',est:false,
  texto:`${o} → ${d}: interestadual de ${ss?7:12}% (Resolução do Senado 22/1989: ${ss?'de Sul/Sudeste, exceto ES, para Norte, Nordeste, Centro-Oeste e ES':'demais fluxos'})`};
}
const qIcmsV=(v,c)=>qIcmsUF(v,c).taxa;
/* Campo do editor que no lugar do número digitado mostra a alíquota calculada (bens) ou pede o ISS municipal (serviços). */
function qEditorImposto(v){
 const c=qCase();
 if(v.regime!=='regular')return '';
 if(c.kind==='goods'){const i=qIcmsUF(v,c);return `<div class="field">ICMS calculado pelas UFs<div class="q-calc"><b>${num(i.taxa,2)}%</b><small>${i.texto}</small></div></div>`}
 return qField('iss','ISS: alíquota municipal (2% a 5%)',v.iss,'number','0.1');
}

/* ===================== SISTEN: crédito de CBS/IBS do fornecedor do Simples, calculado =====================
   O crédito não é mais digitado na proposta: sai da conta do DAS do fornecedor.
     receita bruta dos últimos 12 meses (RBT12) → faixa do anexo → alíquota efetiva → parte de ICMS, CBS e IBS na partilha do ano.
   Limite legal do crédito do comprador: LC 123, art. 23 (ICMS; a redação nova, a partir de 2027, inclui IBS e CBS) e LC 214/2025,
   art. 47, § 9º, II ("montante equivalente ao devido por meio desse regime"). A transição é a progressão do próprio DAS:
   a parte de ICMS cai de 33,5% (até 2028) para 30,15% (2029) ... e some em 2033, enquanto a de IBS sobe de 0,17% para 33,5%.

/* Alíquota efetiva e parte de CBS/IBS do DAS do fornecedor no ano y, e o crédito sobre o valor da compra. */
function qDasCredito(v,c,y,valor){

 let f=A.lim.findIndex(l=>rbt<=l);const fora=f<0;if(fora)f=5;

  ii=A.icms?A.icms[ano][f]:0,efIcms=ef*ii/100,comIcms=c.kind==='goods'&&!!A.icms;
 return{anexo,nome:A.nome,rbt,faixa:f+1,teto:A.lim[f],nom,ded:A.ded[f],ef,pc,pi,efCbs,efIbs,fora,ano,icmsPc:ii,efIcms,comIcms,
  periodo:y<2027?'2026 (lei atual, igual à tabela de 2027–2028)':ano<=2028?'2027–2028':ano===2033?'2033 em diante':String(ano),
  aviso5:anexo==='III'&&f===4&&ef>14.92537,
  cbs:ativo?round(valor*efCbs/100):0,ibs:ativo?round(valor*efIbs/100):0,icms:comIcms?round(valor*efIcms/100):0};
}

 const li=(tipo,rot,t,corpo)=>`<li><span class="badge ${tipo}">${rot}</span><div><b>${t}</b><p>${corpo}</p></div></li>`;
 const a=(k,t)=>`<a href="${Q_LINKS[k]}" target="_blank" rel="noopener">${t} ↗</a>`;
 const itens=[li('green','Existe','PIS e Cofins · até 2026',`O adquirente no regime não cumulativo pode descontar crédito sobre a compra de ${bens} de optante pelo Simples Nacional (Ato Declaratório Interpretativo RFB nº 15/2007, citado no ${a('perguntao','Perguntão do Simples, item 7.5, nota 2')}). O crédito usa as alíquotas do adquirente sobre o valor da aquisição, não o que o fornecedor pagou no DAS: ${money(m26.pcBase)} × 9,25% = <b>${money(round(m26.pis+m26.cof))}</b> (PIS ${money(m26.pis)} + Cofins ${money(m26.cof)}). Vale se a compra gerar direito a crédito (insumo ou revenda) e a TEN estiver no regime não cumulativo, premissa deste caso. PIS e Cofins são extintos a partir de 2027.`)];
 if(das&&c.kind==='goods'){
  const ay=Math.max(2027,o.year),d26=qDasCredito(v,c,2026,m26.raw),dy=qDasCredito(v,c,ay,m26.raw);
  itens.push(li('yellow','Existe, calculado','ICMS · pela parte do DAS',`A LC 123, art. 23, dá ao comprador não optante o crédito de ICMS no montante cobrado dentro do Simples, para mercadorias destinadas a comercialização ou industrialização, observado o ICMS efetivamente devido pelo optante; o fornecedor precisa informar na nota a alíquota do crédito, que é a parte de ICMS do anexo e da faixa dele (${a('perguntao','Perguntão, item 7.5')}; a redação nova do art. 23, de 2027 em diante, foi lida só em resumos de terceiros). Em 2026: alíquota efetiva de ${num(d26.ef,2)}% × ${num(d26.icmsPc,2)}% de ICMS na partilha = <b>${money(d26.icms)}</b>. Na transição o ICMS sai do DAS e o IBS entra no lugar: em ${ay} a parte de ICMS é ${num(dy.icmsPc,2)}% (<b>${money(dy.icms)}</b>) e a de IBS é ${num(dy.pi,2)}% (<b>${money(dy.ibs)}</b>); a soma dos dois créditos fica quase estável até 2033, quando só resta o IBS. O crédito só vale se a nota informar a alíquota (premissa “fiscal confirmada” do fornecedor).`));
 }else if(das)itens.push(li('red','Não gera crédito','ISS','O ISS que o prestador do Simples paga no DAS não gera crédito ao comprador: o art. 23 da LC 123 só prevê ICMS, IBS e CBS.'));
 if(das){
  const ay=Math.max(2027,o.year),d=qDasCredito(v,c,ay,m26.raw),tab=a(d.anexo==='III'?'anexoIII':'anexoI',`tabela do ${d.nome}`);
  itens.push(li('yellow','Existe, calculado','CBS e IBS · de 2027 em diante',`Quando o fornecedor recolhe IBS e CBS dentro do DAS, o adquirente no regime regular só credita o valor desses tributos pago na aquisição, em montante equivalente ao devido por meio do Simples (${a('lc214','LC 214/2025, art. 47, § 9º, II')}), e não a alíquota cheia sobre o preço. Por isso o crédito é <b>calculado</b>, não digitado: receita de 12 meses → faixa → alíquota efetiva → parte de CBS e de IBS na partilha do ano (${tab}, texto compilado do Senado). Em ${ay}, com receita de ${money(d.rbt)} (faixa ${d.faixa}), a alíquota efetiva é ${num(d.ef,2)}%, dos quais ${num(d.pc,2)}% são CBS e ${num(d.pi,2)}% são IBS: crédito de <b>${money(d.cbs)}</b> de CBS e <b>${money(d.ibs)}</b> de IBS (${qPct((d.cbs+d.ibs)/m26.raw*100)} do valor). O IBS cresce até 2033, quando substitui ICMS e ISS. Receita e anexo são hipóteses do exemplo: troque pelos do fornecedor real. A Resolução CGSN 190/2026 não foi lida.${d.aviso5?' Atenção: nesta faixa a fórmula especial do ISS não é aplicada.':''}`));
 }else itens.push(li('green','Existe','CBS e IBS · de 2027 em diante',`O fornecedor apura IBS e CBS pelo regime regular (${a('lc214','LC 214/2025, art. 41, § 3º')}): o crédito segue as regras gerais, pelos valores destacados no documento, desde que o débito seja extinto (art. 47, caput e § 3º).`));
 if(das&&sens){const med=o.pv?'valor presente':'custo após créditos';
  itens.push(li(sens.decide?'yellow':'green',sens.decide?'Decide o mapa':'Não muda a indicação','Quanto pesa no mapa de hoje',`Sem o crédito de PIS/Cofins, o ${med} de ${esc(v.name)} passaria de ${money(sens.me.score)} para <b>${money(sens.sem)}</b>${sens.decide?` e ${esc(sens.rest.x.name)} (${money(sens.rest.m.score)}) ficaria com o menor custo: a indicação de hoje depende de a TEN poder aproveitar esse crédito.`:sens.rest?'; a indicação de hoje continua a mesma.':'.'}`));}
 return `<div class="q-fonte"><h3>O crédito do fornecedor do Simples existe? · ${esc(v.name)}</h3><ul>${itens.join('')}</ul><p class="src">Leitura didática do texto legal, sem parecer fiscal. Confirme a redação vigente e a elegibilidade de cada compra com o Fiscal.</p></div>`;
}
function qMemoria(){
 if(!quoteState.vendors)return '';
 const c=qCase(),o=quoteState,y=o.year,v=o.vendors.find(x=>x.id===o.focus)||o.vendors[0];
 return `<section class="q-mem" id="qMem">${section('Memória de cálculo',`Escolha o fornecedor e veja, passo a passo, como cada valor do mapa foi calculado, hoje e em ${y}. Os números vêm do mesmo cálculo do mapa.`)}<div class="q-mem-tabs" role="group" aria-label="Fornecedor da memória de cálculo">${o.vendors.map(x=>`<button type="button" data-q-mem="${x.id}" class="${x.id===v.id?'active':''}" aria-pressed="${x.id===v.id}">${esc(x.name)}<small>${qRegime(x)}</small></button>`).join('')}</div>${qFonteSimples(v,c)}<div class="quote-maps q-mem-grid">${qMemPane(v,c,2026)}${qMemPane(v,c,y)}</div><p class="source">Memória de cálculo didática, com premissas fictícias. Ela mostra a conta; a validação fiscal vem antes de qualquer decisão real.</p></section>`;
}


/* ===================== SISTEN: casca da trilha ===================== */
const ABAS={inicio:'Comparar NF',cotacoes:'Comparar cotação',fontes:'Fontes e apostila'};
const ETAPAS=[{aba:'inicio',titulo:'Comparar NF',insignia:'Leitor de NF da Reforma'},{aba:'cotacoes',titulo:'Comparar cotação',insignia:'Comprador da Reforma'}];
const XP_ETAPA=100;
const EMBUTIDA=window.parent!==window;
const notify=(evento,dados)=>{try{if(EMBUTIDA)window.parent.postMessage(Object.assign({origem:'trilha-reforma-tributaria',evento},dados||{}),'*')}catch(e){}};
function save(){try{localStorage.setItem('ten-jornada-v1',JSON.stringify({done:state.done}))}catch{}updateProgress()}
function updateProgress(){const n=state.done.length;$('#progressText').textContent=`${n} de ${ETAPAS.length}`;$('#progressBar').style.width=(n/ETAPAS.length*100)+'%'}
function markButton(i){const feito=state.done.includes(i);return `<button class="btn ${feito?'light':''} small rt-done" data-done="${i}" ${feito?'disabled':''}>${feito?'✓ Etapa concluída · '+ETAPAS[i].titulo:'Concluir etapa · '+ETAPAS[i].titulo}</button>`}
function nav(){$('#tabs').innerHTML=Object.entries(ABAS).map(([id,t])=>{const i=ETAPAS.findIndex(e=>e.aba===id),ok=i>=0&&state.done.includes(i);return `<button role="tab" data-tab="${id}" aria-selected="${state.page===id}" class="${state.page===id?'active':''}">${t}${ok?'<span class="rt-ok" title="Etapa concluída">✓</span>':''}</button>`}).join('');updateProgress()}
function render(){if(!ABAS[state.page])state.page='inicio';nav();$('#main').innerHTML=({inicio:notes,cotacoes:quotesPage,fontes:library}[state.page])();$('#main').classList.remove('fade');void $('#main').offsetWidth;$('#main').classList.add('fade');bind()}
function irPara(aba){state.page=aba;render();window.scrollTo(0,0)}
function redraw(){const pos=window.scrollY;render();window.scrollTo(0,pos)}
function on(sel,event,fn){const el=$(sel);if(el)el.addEventListener(event,fn)}
function bind(){
 bindComparison();
 bindQuotes();
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>irPara(el.dataset.tab));
 document.querySelectorAll('[data-done]').forEach(el=>el.onclick=()=>{const i=+el.dataset.done;if(state.done.includes(i))return;state.done=[...state.done,i];save();
  notify('missao-concluida',{missao:i+1,titulo:ETAPAS[i].titulo,insignia:ETAPAS[i].insignia,xpMissao:XP_ETAPA,estrelas:3,missoesConcluidas:state.done.length});
  if(state.done.length===ETAPAS.length)notify('trilha-concluida',{xpTotal:XP_ETAPA*ETAPAS.length});
  toast(state.done.length===ETAPAS.length?'Trilha concluída. As duas etapas ficaram registradas no seu usuário.':`Etapa "${ETAPAS[i].titulo}" concluída.`);redraw()});
 on('#scenario','change',e=>{state.scenario=e.target.value;redraw()});
 on('#glossarySearch','input',e=>$('#glossary').innerHTML=glossary(e.target.value));
}
/* Progresso do usuário e tema vêm do SISTEN (iframe sandbox, sem localStorage). */
addEventListener('message',e=>{const d=e.data;if(e.source!==window.parent||!d||d.destino!=='trilha'||d.evento!=='carregar-progresso')return;
 const g=(d.progresso&&d.progresso.done)||{};
 state.done=[...new Set([...state.done,...Object.keys(g).filter(k=>g[k]).map(k=>+k-1).filter(i=>i>=0&&i<ETAPAS.length)])];
 if(d.tema==='dark'||d.tema==='light')document.documentElement.dataset.theme=d.tema;
 redraw()});
render();
notify('pronta');

</script>
