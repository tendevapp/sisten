<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trilha PO.SUP-0010</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: HUD de jogo fixo (XP, nível, torre do curso) + "console" navy onde mapa, missões, guia e certificado acontecem */
:root{
  --bg:#ffffff; --surface:#F3F6FA; --line:#DAE1EB; --ink:#0F1E3A; --muted:#5A6780;
  --navy:#12305C; --orange:#E8730C; --teal:#0B8481; --bad:#C8342B;
  --stage:#10284D; --stage-2:#183766; --stage-3:#21447A; --stage-line:#2B4D85; --stage-ink:#F2F6FC; --stage-mut:#A4B6D6;
  --s-orange:#FF8A2A; --s-teal:#2EC4B6; --s-bad:#FF6B5E; --s-blue:#7FA4DC;
  --paper:#ffffff; --paper-ink:#10284D; --paper-mut:#7A879C; --paper-line:#DCE3EE; --paper-teal:#0B8481; --paper-orange:#D9650A; --paper-bad:#C8342B;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111D31; --line:#22344F; --ink:#E7EDF6; --muted:#97A5BD;
  --navy:#86A9DD; --orange:#FF9038; --teal:#34BDB4; --bad:#FF6B5E;
  --stage:#0F1B2E; --stage-2:#16253D; --stage-3:#1D3050; --stage-line:#28406A; --stage-ink:#E7EDF6; --stage-mut:#8FA1BE;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D31; --line:#22344F; --ink:#E7EDF6; --muted:#97A5BD;
  --navy:#86A9DD; --orange:#FF9038; --teal:#34BDB4; --bad:#FF6B5E;
  --stage:#0F1B2E; --stage-2:#16253D; --stage-3:#1D3050; --stage-line:#28406A; --stage-ink:#E7EDF6; --stage-mut:#8FA1BE;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--s-orange);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--f-mono);letter-spacing:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=range]{accent-color:var(--s-orange);width:100%}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.hud-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.mission{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.code{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;background:var(--navy);color:var(--bg);padding:3px 8px;border-radius:6px;white-space:nowrap}
.mission b{font-family:var(--f-display);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.towerbar{flex:0 1 300px;min-width:0}
.towerbar svg{width:100%;height:auto;display:block}
.tb-seg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.tb-seg.done{fill:var(--navy);stroke:var(--navy)}
.tb-seg.now{fill:var(--orange);stroke:var(--orange)}
.rotor{transform-box:view-box;animation:spin 6s linear infinite}
.rotor line{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.fast .rotor{animation-duration:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.player{display:flex;align-items:center;gap:12px;flex:0 1 340px;min-width:0}
.lvl{position:relative;width:46px;height:46px;flex:none}
.lvl svg{width:46px;height:46px;transform:rotate(-90deg)}
.lvl circle{fill:none;stroke-width:4}
.lvl .bgc{stroke:var(--surface)} .lvl .fgc{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.lvl span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.pl-txt{min-width:0;flex:1}
.pl-name{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:99px;transition:width .8s ease}
.xpnum{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xpnum small{font-size:13px;color:var(--muted);font-weight:600}
.badges{display:flex;gap:4px}
.hex{width:20px;height:22px}
.hex path{fill:var(--surface);stroke:var(--line)}
.hex.on path{fill:var(--teal);stroke:var(--teal)}
@media (max-width:860px){.towerbar{display:none}}
@media (max-width:760px){.badges{display:none}}

/* ---------- Fases ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-top:22px;display:grid;gap:16px}
.phases{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.ph{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.ph em{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-display);font-size:14px;color:var(--ink)}
.ph[aria-current="step"]{border-color:var(--navy);color:var(--ink)}
.ph[aria-current="step"] em{background:var(--orange);color:#fff}
.ph.ok em{background:var(--teal);color:#fff}
.ph.map em{background:var(--navy);color:var(--bg)}
@media (max-width:560px){.ph span{display:none}.ph{padding:5px}}

/* ---------- Console ---------- */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:20px;padding:clamp(18px,3.4vw,34px);min-height:560px;position:relative;overflow:hidden;isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background:radial-gradient(600px 300px at 85% -10%,var(--stage-3),transparent 70%),radial-gradient(500px 260px at -10% 110%,var(--stage-2),transparent 70%)}
.scr{display:grid;gap:22px;animation:scrIn .45s ease-out;align-content:start}
@keyframes scrIn{from{transform:translateY(10px)}to{transform:none}}
.kick{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--s-orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;border:1.5px solid var(--stage-line);background:transparent;color:var(--stage-ink);transition:transform .15s,background .2s,border-color .2s}
.btn:hover{border-color:var(--stage-mut)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.go{background:var(--s-orange);border-color:var(--s-orange);color:#1C0E00}
.btn.go:hover{filter:brightness(1.06)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-orange) 60%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.btn svg.i{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--stage-line);white-space:nowrap}
.chip.t{color:var(--s-teal)} .chip.o{color:var(--s-orange)} .chip.b{color:var(--s-bad)}
.chip svg.i{width:15px;height:15px}

/* ---------- Mapa ---------- */
.maphero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center}
@media (max-width:720px){.maphero{grid-template-columns:1fr}.bigtower{display:none}}
.maphero h1{font-size:clamp(42px,6vw,72px)}
.maphero h1 span{color:var(--s-orange)}
.mstats{display:flex;gap:10px;flex-wrap:wrap}
.bigtower svg{width:100%;height:auto;display:block;max-height:300px}
.bt-seg{fill:var(--stage-2);stroke:var(--stage-line);stroke-width:1.5}
.bt-seg.done{fill:var(--s-teal);stroke:var(--s-teal)}
.bt-seg.next{fill:var(--s-orange);stroke:var(--s-orange)}
.bt-num{font-family:var(--f-mono);font-size:10px;fill:var(--stage-mut)}
.bigtower .rotor line{stroke:var(--stage-ink);stroke-width:3}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tile{width:100%;height:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;gap:6px 12px;text-align:left;background:var(--stage-2);border:1.5px solid var(--stage-line);border-radius:16px;padding:14px;color:var(--stage-ink);transition:transform .15s,border-color .2s}
.tile:hover:not([disabled]){transform:translateY(-3px);border-color:var(--stage-mut)}
.tile .tic{grid-row:span 2;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--stage-3);color:var(--s-teal)}
.tile .tn{font-family:var(--f-mono);font-size:12px;color:var(--stage-mut)}
.tile b{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.05}
.tile .tf{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;align-self:end;margin-top:6px}
.tile.done{border-color:color-mix(in srgb,var(--s-teal) 60%,var(--stage-line))}
.tile.done .tic{background:var(--s-teal);color:#062A28}
.tile.next{border-color:var(--s-orange)}
.tile.next .tic{background:var(--s-orange);color:#1C0E00}
.tile[disabled]{opacity:.45;cursor:default}
.mstars{display:flex;gap:2px}
.mstars svg{width:16px;height:16px}
.mstars path{fill:var(--stage-3)} .mstars .on path{fill:var(--s-orange)}
.mapfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--stage-line);padding-top:16px}
.tg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--stage-mut);cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--s-orange)}
.done-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--s-teal) 18%,var(--stage-2));border:1px solid var(--s-teal);border-radius:16px;padding:14px 18px}
.done-banner b{font-family:var(--f-display);font-size:24px}

/* Briefing */
.brief{display:grid;gap:30px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
@media (max-width:820px){.brief{grid-template-columns:1fr}}
.brief h1{font-size:clamp(42px,6.2vw,74px)}
.brief h1 span{color:var(--s-orange)}
.rewards{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rw{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--stage-2);border:1px solid var(--stage-line);border-radius:12px;padding:10px 14px}
.rw .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--stage-3);color:var(--s-teal)}
.rw b{font-family:var(--f-display);font-size:20px;font-weight:600}
.rw .xp{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--s-orange);white-space:nowrap}
.rw.badge .ico{color:var(--s-orange)}
.donut{position:relative;max-width:360px;width:100%;justify-self:center}
.donut svg{width:100%;height:auto;display:block;overflow:visible}
.donut .arc{fill:none;stroke-width:26;animation:draw 1s cubic-bezier(.6,0,.3,1) both;animation-delay:calc(var(--d)*.25s + .2s)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .center b{font-family:var(--f-display);font-size:88px;line-height:.9}
.donut .center small{color:var(--stage-mut);font-weight:600;font-size:15px}
.dl{font-family:var(--f-display);font-weight:600;font-size:17px;fill:var(--stage-ink)}
.dl tspan.n{font-weight:700;font-size:22px}

/* Medalha */
.medal{position:relative;justify-self:center;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.medal > svg{width:100%;height:100%;display:block}
.medal .rays{transform-box:view-box;transform-origin:100px 100px;animation:spin 18s linear infinite}
.medal .rays path{fill:var(--stage-3)}
.medal .hexo{fill:var(--s-orange)}
.medal .hexi{fill:var(--stage)}
.medal .gl{color:var(--stage-ink)}
.medal .gl svg,.medal svg .gl{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.medal .core{transform-box:view-box;transform-origin:100px 100px;animation:medalIn .9s cubic-bezier(.3,1.5,.5,1) both}
.medal.locked .hexo{fill:var(--stage-3)} .medal.locked .core{animation:none} .medal.locked .gl{color:var(--stage-mut);opacity:.7}
.medal .mlbl{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;fill:var(--stage-mut);text-anchor:middle}
@keyframes medalIn{0%{transform:scale(.2) rotate(-200deg)}100%{transform:none}}

/* Watch */
.wtop{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:12px;min-width:0}
.docmini{width:38px;height:46px;flex:none}
.docmini path{fill:var(--paper);stroke:var(--paper-ink);stroke-width:1.5}
.docmini text{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--paper-ink);text-anchor:middle}
.stico{width:44px;height:44px;border-radius:12px;background:var(--stage-3);display:grid;place-items:center;color:var(--s-teal);flex:none}
.status .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-mut);font-weight:700}
.status .v{font-weight:700;font-size:17px}
.daybox{text-align:right}
.daybox b{display:inline-block;font-family:var(--f-display);font-size:52px;line-height:.9;color:var(--s-orange);font-variant-numeric:tabular-nums}
.daybox b.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.daybox small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-mut);font-weight:700}
.scene{position:relative;border-radius:16px;background:var(--stage-2);border:1px solid var(--stage-line);overflow:hidden;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
.vig{display:grid;place-items:center;width:100%;min-height:320px;padding:22px 18px;min-width:0}
.stx{display:grid;align-content:center;gap:14px;padding:28px clamp(18px,2.6vw,32px);border-right:1px solid var(--stage-line);background:color-mix(in srgb,var(--stage) 35%,var(--stage-2));animation:txL .5s ease-out both;min-width:0}
.scene.flip .stx{order:2;border-right:0;border-left:1px solid var(--stage-line);animation-name:txR}
@keyframes txL{from{transform:translateX(-24px);opacity:0}}
@keyframes txR{from{transform:translateX(24px);opacity:0}}
.stx-h{display:flex;align-items:baseline;gap:12px}
.stx-h .n{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.9;color:var(--s-orange);font-variant-numeric:tabular-nums}
.stx-h h3{font-size:clamp(24px,2.6vw,30px)}
.stx p{margin:0;font-size:17px;line-height:1.6;max-width:48ch;color:var(--stage-ink)}
.stx p b{color:var(--s-orange);font-weight:700}
.chip.hint{background:var(--s-orange);border-color:var(--s-orange);color:#1C0E00;animation:pulse 1.6s infinite}
.tbar{display:block;height:3px;border-radius:2px;background:var(--stage-line);overflow:hidden;visibility:hidden}
.tbar b{display:block;height:100%;background:var(--s-orange);transform-origin:left;transform:scaleX(0)}
.fast .tbar{visibility:visible}
.fast .tbar b{animation:tb linear forwards}
@keyframes tb{to{transform:scaleX(1)}}
@media (max-width:860px){.scene{grid-template-columns:1fr}.scene .stx,.scene.flip .stx{order:2;border:0;border-top:1px solid var(--stage-line);animation-name:rise}.vig{min-height:260px}}
.intro{margin:0;font-size:18px;line-height:1.55;color:var(--stage-mut);max-width:52ch}
.ginst{margin:0;font-size:16px;color:var(--stage-mut);max-width:60ch}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;box-shadow:0 14px 30px rgba(0,0,0,.28);padding:12px 14px;font-size:13px}
.paper h5{font-family:var(--f-display);font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
.paper h5 span{font-family:var(--f-mono);font-size:11px;color:var(--paper-mut);font-weight:500}
.fl{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin-top:7px;font-size:11px;color:var(--paper-mut);font-weight:600}
.fl i{height:9px;border-radius:3px;background:var(--paper-line);transform-origin:left;display:block}
.fl i.f{background:var(--paper-ink);animation:grow .45s ease-out both;animation-delay:calc(var(--d)*.4s + .2s)}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.form{width:min(260px,80%)}
.caret{display:inline-block;width:2px;height:12px;background:var(--paper-orange);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.appr{position:relative}
.appr .paper{width:200px;animation:thud .25s 1s}
.stamp{position:absolute;right:-26px;bottom:-14px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.08em;color:var(--paper-teal);border:3px solid var(--paper-teal);border-radius:6px;padding:0 10px;background:color-mix(in srgb,var(--paper) 85%,transparent);transform:rotate(-12deg);white-space:nowrap;animation:stamp .5s .6s cubic-bezier(.2,1.4,.5,1) both}
.stamp.bad{color:var(--paper-bad);border-color:var(--paper-bad)}
@keyframes stamp{0%{transform:scale(2.8) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes thud{50%{transform:translateY(4px)}}
.who{position:absolute;left:-62px;top:-10px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--stage-mut)}
.who i{width:40px;height:40px;border-radius:50%;background:var(--stage-3);display:grid;place-items:center;color:var(--s-teal);font-style:normal}
@media (max-width:480px){.who{display:none}.stamp{right:-6px}}
.props{display:flex;gap:12px;justify-content:center;width:100%}
.prop{width:min(150px,30%);transform:rotate(var(--r));animation:fly .6s cubic-bezier(.2,1.1,.4,1) both;animation-delay:calc(var(--d)*.3s + .15s)}
.prop b{display:block;font-family:var(--f-display);font-size:22px;margin-top:2px}
.prop small{color:var(--paper-mut);font-weight:600}
.prop.late{outline:2px dashed var(--paper-orange);outline-offset:3px}
.prop .ltag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#fff;background:var(--paper-orange);border-radius:99px;padding:1px 7px}
@keyframes fly{from{transform:translate(110%,-30px) rotate(25deg);opacity:0}to{transform:rotate(var(--r));opacity:1}}
.qqp{width:min(380px,92%)}
.bar{display:grid;grid-template-columns:22px 1fr 74px;gap:8px;align-items:center;margin-top:8px;font-weight:700}
.bar i{height:16px;border-radius:4px;background:var(--paper-line);transform-origin:left;display:block;animation:grow .7s ease-out both;animation-delay:calc(var(--d)*.25s + .2s)}
.bar.win i{background:var(--paper-orange)}
.bar span{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.wtag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--paper-orange);padding:2px 8px;border-radius:99px;animation:pop .5s 1.2s cubic-bezier(.3,1.7,.5,1) both}
.pcwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center}
.pc{width:190px}
.sig{display:block;width:100%;height:34px;margin-top:6px}
.sig path{fill:none;stroke:var(--paper-ink);stroke-width:2;stroke-dasharray:220;stroke-dashoffset:0;animation:sign 1.1s .3s ease-in-out both}
@keyframes sign{from{stroke-dashoffset:220}}
.ladder{display:flex;flex-direction:column-reverse;gap:4px}
.rung{min-width:58px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:14px;border-radius:5px;padding:1px 8px;background:var(--stage-3);color:var(--stage-mut);white-space:nowrap}
.rung.go{background:var(--s-teal);color:#062A28;animation:lit .35s both;animation-delay:calc(var(--d)*.3s + .3s)}
.rung.top{background:var(--s-orange);color:#1C0E00}
.ladder.wide .rung{text-align:left;min-width:230px;font-size:15px;padding:3px 10px}
.ladder.wide .rung em{font-style:normal;opacity:.75;font-weight:600;margin-left:6px}
@keyframes lit{from{background:var(--stage-3);color:var(--stage-mut);transform:scale(.9)}}
.lnote{font-size:12px;color:var(--stage-mut);font-weight:700;margin-top:6px;text-align:center}
.send{position:relative;width:min(440px,90%);height:120px}
.send .pcm{position:absolute;left:0;top:26px;width:70px;height:86px;padding:8px}
.send .bld{position:absolute;right:0;top:20px;width:76px;height:76px;border-radius:14px;background:var(--stage-3);display:grid;place-items:center;color:var(--stage-ink)}
.send .bld svg{width:40px;height:40px}
.send .path{position:absolute;left:84px;right:90px;top:60px;border-top:2px dashed var(--stage-line)}
.plane{position:absolute;top:44px;left:calc(100% - 118px);color:var(--s-orange);animation:plane 1.3s .2s cubic-bezier(.5,0,.4,1) both}
@keyframes plane{from{left:84px;transform:translateY(0)}50%{transform:translateY(-14px)}to{left:calc(100% - 118px);transform:none}}
.okb{position:absolute;right:-6px;top:-12px;background:var(--s-teal);color:#062A28;font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px;white-space:nowrap;animation:pop .45s 1.5s cubic-bezier(.3,1.7,.5,1) both}
.okb.bad{background:var(--s-bad);color:#fff}
.road{position:relative;width:min(480px,92%);height:130px}
.road .ln{position:absolute;left:0;right:0;bottom:22px;height:4px;background:repeating-linear-gradient(90deg,var(--stage-line) 0 16px,transparent 16px 28px);animation:roll .6s linear infinite}
@keyframes roll{to{background-position:-28px 0}}
.truck{position:absolute;bottom:28px;left:calc(100% - 46px);color:var(--stage-ink);animation:drive 2.6s .2s cubic-bezier(.5,0,.5,1) both}
.truck svg{width:46px;height:46px}
@keyframes drive{from{left:0}to{left:calc(100% - 46px)}}
.mile{position:absolute;top:0;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--stage-mut);transform:translateX(-50%);white-space:nowrap}
.mile i{width:14px;height:14px;border-radius:50%;background:var(--s-teal);display:block;animation:lit2 .3s both;animation-delay:calc(var(--d)*.75s + .5s)}
@keyframes lit2{from{background:var(--stage-3);transform:scale(.6)}}
.wh{position:relative;width:170px;height:170px}
.wh .house{position:absolute;inset:auto 0 0 0;color:var(--stage-ink)}
.wh .house svg{width:170px;height:130px;stroke-width:1.6}
.box{position:absolute;left:62px;top:84px;width:46px;height:40px;background:var(--s-orange);border-radius:4px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);animation:drop .9s .2s cubic-bezier(.3,0,.4,1) both}
.box::after{content:"";position:absolute;left:20px;top:0;bottom:0;width:6px;background:rgba(255,255,255,.55)}
@keyframes drop{0%{transform:translateY(-140px)}70%{transform:translateY(0)}82%{transform:translateY(-10px)}100%{transform:none}}
.wh .okb{right:-90px;top:20px;animation-delay:1.1s}
@media (max-width:480px){.wh .okb{right:-40px;top:-6px}}

/* Vinhetas genéricas */
.vf{display:grid;justify-items:center;gap:14px;text-align:center;max-width:560px}
.vf-ico{width:86px;height:86px;border-radius:22px;background:var(--stage-3);display:grid;place-items:center;color:var(--s-teal);animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;font-family:var(--f-display);font-weight:700;font-size:56px}
.vf-ico svg.i{width:44px;height:44px}
.vf-ico.o{background:var(--s-orange);color:#1C0E00} .vf-ico.bad{background:var(--s-bad);color:#fff} .vf-ico.ok{background:var(--s-teal);color:#062A28}
.vf-big{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.05;animation:rise .45s .2s both}
.vf-facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.vf-facts .chip{font-size:14px;padding:6px 12px;animation:slideIn .45s both;animation-delay:calc(var(--d)*.16s + .4s);white-space:normal}
.vf-facts.req .chip{animation-delay:calc(var(--d)*.16s + 1s)}
.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;width:100%;max-width:640px}
.icn{display:grid;justify-items:center;gap:6px;background:var(--stage-3);border-radius:14px;padding:14px 8px;text-align:center;font-weight:700;font-size:14px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d)*.12s + .1s)}
.icn svg.i{width:30px;height:30px;color:var(--s-teal)}
.belt{position:relative;width:min(480px,92%);height:150px}
.belt .rail{position:absolute;left:0;right:0;bottom:30px;height:6px;border-radius:3px;background:var(--stage-line)}
.belt .secs{position:absolute;left:0;bottom:40px;display:flex;gap:10px;animation:beltgo .9s linear 2}
.belt .secs i{width:58px;height:38px;border-radius:6px;background:var(--s-blue);display:block}
.belt .secs i.gap{background:transparent;border:2px dashed var(--s-bad);animation:pulse2 1s 1.8s infinite}
@keyframes beltgo{from{transform:translateX(-68px)}to{transform:none}}
@keyframes pulse2{50%{border-color:transparent}}
.belt .okb{right:0;top:0;animation-delay:1.8s}
.pillars{display:flex;gap:18px;align-items:flex-end;height:190px}
.pil{display:grid;justify-items:center;gap:8px;font-weight:700;font-size:14px;text-align:center}
.pil i{width:70px;border-radius:8px 8px 0 0;background:linear-gradient(var(--s-teal),color-mix(in srgb,var(--s-teal) 40%,var(--stage-2)));display:block;transform-origin:bottom;animation:growY .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--d)*.25s + .2s)}
.scope{position:relative;width:min(520px,94%);display:grid;gap:18px}
.scope .line{height:4px;background:var(--s-teal);border-radius:2px;transform-origin:left;animation:grow 1.2s .2s ease-out both}
.scope .ends{display:flex;justify-content:space-between;gap:10px}
.scope .ppl{display:flex;justify-content:space-around}
.scope .ppl span{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--stage-mut);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d)*.2s + .6s)}
.scope .ppl i{width:38px;height:38px;border-radius:50%;background:var(--stage-3);display:grid;place-items:center;color:var(--s-teal)}
.nopc{position:relative;display:flex;align-items:center;gap:22px}
.nopc .ghost{width:90px;height:110px;border:2px dashed var(--stage-mut);border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--stage-mut)}
.nopc .trk{color:var(--stage-ink);animation:slideIn .8s both}
.nopc .trk svg{width:70px;height:70px}
.nopc .stamp{right:-30px;bottom:auto;top:30px;font-size:30px}
.nopc .okb{right:auto;left:0;top:auto;bottom:-44px;animation-delay:1.3s}
.sap{position:relative;display:grid;justify-items:center;gap:10px}
.sap .docs{display:flex;gap:16px}
.sap .docs .paper{width:96px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;animation:fall .7s cubic-bezier(.4,0,.4,1.2) both;animation-delay:calc(var(--d)*.3s + .2s)}
@keyframes fall{from{transform:translateY(-60px) rotate(-10deg);opacity:0}}
.sap .sbox{width:220px;height:70px;border-radius:14px;background:var(--stage-3);border:2px solid var(--s-teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.1em;color:var(--s-teal)}
.race{width:min(520px,94%);display:grid;gap:18px}
.lane{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;font-weight:700}
.lane .tr{position:relative;height:30px;border-radius:8px;background:var(--stage-3);overflow:hidden}
.lane .tr i{position:absolute;inset:0 auto 0 0;border-radius:8px;transform-origin:left;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-family:var(--f-display);font-style:normal;font-size:17px;white-space:nowrap}
.lane.p i{width:100%;background:var(--s-blue);color:#0A1A33;animation:grow 2.6s .3s linear both}
.lane.u i{width:17%;min-width:76px;background:var(--s-orange);color:#1C0E00;animation:grow .45s .3s linear both}
.one{display:flex;gap:18px;align-items:center}
.one .prop{width:150px}
.one .okb{position:static;animation-delay:.9s}
.lateset{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.laudo{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.laudo .paper{width:150px}
.laudo .att{animation:slideIn .6s .7s both}
.wts{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center;width:100%;max-width:620px}
@media (max-width:560px){.wts{grid-template-columns:1fr;justify-items:center}}
.wts svg{width:200px;height:200px}
.wts .arc{fill:none;stroke-width:30;animation:draw .8s cubic-bezier(.6,0,.3,1) both;animation-delay:calc(var(--d)*.12s + .1s)}
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:14px;font-weight:600}
.wlist span{display:flex;justify-content:space-between;gap:8px;animation:slideIn .4s both;animation-delay:calc(var(--d)*.1s + .3s)}
.wlist b{font-family:var(--f-display);font-size:18px}
.wlist i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* Widgets */
.wg{width:100%;max-width:640px;display:grid;gap:14px}
.wg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wg-top label{font-weight:700;color:var(--stage-mut);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.wg-top b{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.slots3{display:flex;gap:12px;justify-content:center}
.slots3 span{width:74px;height:92px;border-radius:8px;border:2px dashed var(--stage-line);display:grid;place-items:center;color:var(--stage-mut);transition:background .25s,border-color .25s,color .25s,transform .25s}
.slots3 span.on{background:var(--paper);border:2px solid var(--paper);color:var(--paper-ink);transform:translateY(-4px)}
.slots3 svg.i{width:30px;height:30px}
.wg-res{text-align:center;font-family:var(--f-display);font-size:26px;font-weight:700}
.wg-res em{font-style:normal;color:var(--s-orange)}
.alc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
@media (max-width:560px){.alc{grid-template-columns:1fr}}
.alc .ladder .rung{transition:background .25s,color .25s}
.alc .ladder .rung.go{animation:none}
.aval{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:20px;align-items:center;width:100%;max-width:720px}
@media (max-width:600px){.aval{grid-template-columns:1fr}}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
@media (max-width:600px){.crit{grid-template-columns:1fr}}
.crit label{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:13px;font-weight:700}
.crit label small{color:var(--stage-mut);font-weight:700}
.crit input{grid-column:1/-1}
.score{display:grid;justify-items:center;gap:8px;text-align:center}
.score b{font-family:var(--f-display);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px;border-radius:99px;padding:3px 14px}
.verdict.p{background:var(--s-teal);color:#062A28} .verdict.r{background:var(--s-orange);color:#1C0E00} .verdict.n{background:var(--s-bad);color:#fff}
.score small{color:var(--stage-mut);font-weight:600;font-size:13px;max-width:24ch}

/* Track */
.track{position:relative;padding:34px 0 0}
.stations{display:flex;justify-content:space-between;position:relative}
.rail-ln{position:absolute;left:22px;right:22px;top:calc(34px + 21px);height:4px;border-radius:2px;background:var(--stage-line)}
.rail-ln i{position:absolute;inset:0;background:var(--s-teal);transform-origin:left;transform:scaleX(0);transition:transform .8s cubic-bezier(.6,0,.3,1);border-radius:2px}
.st{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;border:2px solid var(--stage-line);background:var(--stage);color:var(--stage-mut);display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s,transform .3s;padding:0}
.st.done{background:var(--s-teal);border-color:var(--s-teal);color:#062A28}
.st.now{background:var(--s-orange);border-color:var(--s-orange);color:#1C0E00;transform:scale(1.15)}
.st.now::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--s-orange);animation:ring 1.6s ease-out infinite}
.st .lt{font-family:var(--f-display);font-weight:700;font-size:20px}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.4);opacity:0}}
.token{position:absolute;top:0;min-width:30px;height:24px;padding:0 5px;transform:translateX(-50%);transition:left .8s cubic-bezier(.6,0,.3,1);left:23px;background:var(--paper);color:var(--paper-ink);border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3);white-space:nowrap}
.token::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--paper)}
@media (max-width:520px){.st{width:34px;height:34px}.st svg.i{width:17px;height:17px}.rail-ln{left:17px;right:17px;top:calc(34px + 15px)}}
.cap{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.cap .n{grid-row:span 2;font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.9;color:var(--s-orange);font-variant-numeric:tabular-nums}
.cap h3{font-size:30px}
.cap p{margin:0;color:var(--stage-mut);font-size:17px}
.cap .row{grid-column:1/-1;margin-top:4px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ibtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--stage-line);background:transparent;color:var(--stage-ink);display:grid;place-items:center}
.ibtn:hover{border-color:var(--stage-mut)}
.ibtn.main{width:54px;height:54px;background:var(--stage-ink);color:var(--stage);border:0}
.sla{display:grid;grid-template-columns:repeat(19,1fr);height:8px;border-radius:99px;overflow:hidden;gap:2px;position:relative}
.sla i:nth-child(1){grid-column:span 2;background:var(--s-teal)}
.sla i:nth-child(2){grid-column:span 8;background:var(--s-blue)}
.sla i:nth-child(3){grid-column:span 3;background:var(--s-orange)}
.sla i:nth-child(4){grid-column:span 2;background:var(--s-teal)}
.sla i:nth-child(5){grid-column:span 4;background:repeating-linear-gradient(135deg,var(--stage-line) 0 4px,transparent 4px 7px)}
.sla-l{display:flex;justify-content:space-between;font-size:12px;color:var(--stage-mut);font-weight:700;margin-top:6px;gap:8px;flex-wrap:wrap}

/* Jogos */
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.bhead h2{font-size:clamp(30px,4vw,42px)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--stage-2);border:1px solid var(--stage-line);border-radius:10px;padding:6px 12px;min-width:74px}
.stat small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mut);font-weight:700}
.stat b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat.combo b{color:var(--s-orange)}
.stat.hot{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
@media (max-width:760px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}.slot{height:64px}.slot.full span{display:none}.slot.full svg.i{width:28px;height:28px}}
.slot{height:84px;border-radius:12px;border:2px dashed var(--stage-line);display:grid;place-items:center;align-content:center;gap:4px;text-align:center;font-family:var(--f-display);color:var(--stage-mut);font-size:22px;font-weight:700;padding:4px;min-width:0}
.slot.next{border-color:var(--s-orange);color:var(--s-orange)}
.slot.full{border-style:solid;border-color:var(--s-teal);background:color-mix(in srgb,var(--s-teal) 16%,transparent);color:var(--stage-ink);font-size:14px;line-height:1.05;animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.slot.full svg.i{color:var(--s-teal)}
.pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.pool{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;align-items:center;gap:12px;text-align:left;background:var(--stage-2);border:1.5px solid var(--stage-line);border-radius:14px;padding:14px;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.05;color:var(--stage-ink);transition:transform .15s,border-color .2s,opacity .3s;min-width:0}
.card svg.i{color:var(--s-teal)}
.card:hover{transform:translateY(-2px);border-color:var(--stage-mut)}
.card.used{opacity:.18;pointer-events:none;transform:scale(.94)}
.bad{border-color:var(--s-bad)!important;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.deck{display:grid;gap:18px;justify-items:center}
.dcard{width:min(460px,100%);min-height:150px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:20px 22px;display:grid;align-content:center;gap:6px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.3);animation:dealIn .45s cubic-bezier(.3,1.3,.5,1)}
.dcard small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-mut)}
.dcard b{font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);line-height:1.08}
.dcard.out{animation:dealOut .35s ease-in forwards}
.dcard.bad{animation:shake .4s;box-shadow:0 0 0 3px var(--s-bad),0 18px 40px rgba(0,0,0,.3)}
@keyframes dealIn{from{transform:translateY(-30px) rotate(-4deg) scale(.9);opacity:0}}
@keyframes dealOut{to{transform:translateY(40px) scale(.85);opacity:0}}
.dleft{font-size:13px;font-weight:700;color:var(--stage-mut);letter-spacing:.08em;text-transform:uppercase}
.bkts{display:grid;gap:10px;width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
.bkts[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.bkts[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.bkts[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.bkts[data-n="6"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bkt{display:grid;gap:4px;justify-items:center;align-content:start;overflow:hidden;background:var(--stage-2);border:1.5px solid var(--stage-line);border-radius:14px;padding:14px 10px;color:var(--stage-ink);transition:transform .15s,border-color .2s;min-width:0}
.bkt:hover{border-color:var(--stage-mut);transform:translateY(-2px)}
.bkt b{font-family:var(--f-display);font-size:22px;line-height:1.05;text-align:center}
.bkt .cnt{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--s-teal)}
.bkt.hit{border-color:var(--s-teal);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.bkt.hint{border-color:var(--s-orange);animation:pulse 1.2s infinite}
.bkt .mini{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.bkt .mini i{font-style:normal;font-size:11px;font-weight:600;color:var(--stage-mut);background:var(--stage-3);border-radius:4px;padding:0 5px;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--stage-2);border:1px solid var(--s-teal);border-radius:16px;padding:16px 20px;animation:scrIn .4s}
.banner h3{font-size:28px}
.stars{display:flex;gap:4px}
.stars svg{width:30px;height:30px}
.stars path{fill:var(--stage-3);stroke:none}
.stars .on path{fill:var(--s-orange)}
.stars .on{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--d)*.2s)}

/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--stage-mut)}
.qnum b{color:var(--stage-ink);font-size:24px}
.timer{height:10px;border-radius:99px;background:var(--stage-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--s-teal);border-radius:99px;transform-origin:left}
.timer.warn i{background:var(--s-orange)} .timer.crit i{background:var(--s-bad)}
.qtxt{font-size:clamp(28px,4vw,44px);max-width:24ch}
.opts{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--stage-2);border:1.5px solid var(--stage-line);border-radius:14px;padding:16px;font-weight:700;font-size:17px;min-height:76px;transition:border-color .2s,background .2s,transform .15s;color:var(--stage-ink)}
.opt kbd{font-family:var(--f-display);font-size:18px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--stage-3);flex:none}
.opt:hover{border-color:var(--stage-mut)}
.opt.right{border-color:var(--s-teal);background:color-mix(in srgb,var(--s-teal) 22%,var(--stage-2))}
.opt.right kbd{background:var(--s-teal);color:#062A28}
.opt.wrong{border-color:var(--s-bad);animation:shake .4s}
.opt.wrong kbd{background:var(--s-bad);color:#fff}
.opt[disabled]{cursor:default}
.expl{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;min-height:54px}
.expl p{margin:0;font-size:18px;font-weight:600;max-width:60ch}
.expl p b{color:var(--s-teal)} .expl p b.x{color:var(--s-bad)}

/* Resultado */
.res{display:grid;gap:30px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center}
@media (max-width:820px){.res{grid-template-columns:1fr}}
.res h2{font-size:clamp(40px,5.4vw,64px)}
.res h2 span{color:var(--s-orange)}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rstats .stat b{font-size:30px}
.unlock{display:flex;align-items:center;gap:14px;background:var(--stage-2);border:1px solid var(--stage-line);border-radius:14px;padding:12px 16px}
.unlock .lk{width:44px;height:44px;border-radius:12px;background:var(--s-orange);color:#1C0E00;display:grid;place-items:center;flex:none;animation:pop .6s 1.2s cubic-bezier(.3,1.7,.5,1) both}
.unlock small{display:block;color:var(--stage-mut);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.unlock b{font-family:var(--f-display);font-size:22px;font-weight:600}

/* Guia */
.guide{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.gcard{background:var(--stage-2);border:1px solid var(--stage-line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.gcard h3{font-size:24px;display:flex;align-items:center;gap:10px}
.gcard h3 svg.i{color:var(--s-teal)}
.gt{width:100%;border-collapse:collapse;font-size:14px}
.gt td,.gt th{padding:6px 4px;border-bottom:1px solid var(--stage-line);text-align:left;vertical-align:top}
.gt th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mut)}
.gt td:first-child{font-family:var(--f-display);font-weight:700;font-size:16px}
.gt td.n{text-align:right;font-variant-numeric:tabular-nums}
.gnote{font-size:12px;color:var(--stage-mut);margin:0}
.gwrap{overflow-x:auto}

/* Certificado */
.cert{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:clamp(20px,4vw,44px);display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid var(--paper-line);border-radius:12px;pointer-events:none}
.cert .ck{font-family:var(--f-display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-orange);font-size:15px}
.cert h2{font-size:clamp(34px,5vw,56px)}
.cert .nm{font-family:var(--f-display);font-size:clamp(30px,4.6vw,48px);font-weight:600;border-bottom:2px solid var(--paper-ink);padding:0 20px 4px;min-width:min(420px,90%)}
.cert p{margin:0;max-width:60ch;color:var(--paper-mut);font-weight:600}
.cert .bdg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cert .bdg span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:1px solid var(--paper-line);border-radius:99px;padding:3px 10px}
.cert .bdg svg.i{width:14px;height:14px;color:var(--paper-teal)}
.nmin{display:grid;gap:6px;max-width:420px}
.nmin label{font-weight:700;font-size:14px;color:var(--stage-mut)}
.nmin input{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--stage-line);background:var(--stage-2);color:var(--stage-ink)}

/* Encaixe (dentro do SISTEN, telas ≥ 760px): a página é montada numa largura
   de projeto e escalada para ocupar a janela inteira, sem rolagem — reduz numa
   janela pequena e amplia na tela cheia. O quadro central cresce até o fim. */
html.fit,html.fit body{height:100%;overflow:hidden}
html.fit.fit-rola,html.fit.fit-rola body{overflow-y:auto}
html.fit body{padding:0}
html.fit #fitbox{position:relative;overflow:hidden}
html.fit #fit{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;padding:0 20px 10px}
html.fit .hud-in,html.fit .wrap{max-width:none}
html.fit .wrap{flex:1;display:flex;flex-direction:column;padding-top:14px;gap:12px;margin:0;width:100%}
html.fit .hud-in{margin:0}
html.fit .stage{flex:1;min-height:0;display:flex;flex-direction:column}
html.fit .stage>.scr{flex:1;align-content:center}
html.fit #s-watch{grid-template-rows:auto 1fr auto auto auto}
html.fit .vig{min-height:260px}

/* Floating */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.xpf{position:fixed;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--orange);text-shadow:0 2px 0 var(--bg);animation:xpf 1.1s ease-out forwards;transform:translate(-50%,-50%);z-index:51;pointer-events:none}
@keyframes xpf{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
.lvup{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);z-index:52;background:var(--navy);color:var(--bg);border-radius:14px;padding:12px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:lv 3.2s ease forwards;white-space:nowrap;max-width:calc(100vw - 32px)}
.lvup b{font-family:var(--f-display);font-size:24px}
.lvup span{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
@keyframes lv{0%{transform:translate(-50%,-30px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.foot{font-size:13px;color:var(--muted);margin:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Extras contratos */
.chkl{width:min(380px,94%);position:relative}
.chkl ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.chkl li{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;animation:slideIn .35s both;animation-delay:calc(var(--d)*.12s + .2s)}
.chkl li i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:var(--paper-teal);color:#fff;flex:none}
.chkl li.no i{background:var(--paper-bad)}
.chkl li.no{color:var(--paper-bad)}
.chkl .okb{right:-10px;top:-14px;animation-delay:1.2s}
.fold{display:grid;justify-items:center;gap:12px;text-align:center;max-width:560px}
.fold-ic{width:80px;height:80px;border-radius:20px;background:var(--s-orange);color:#1C0E00;display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.fold-ic svg.i{width:40px;height:40px}
.fold code{font-size:12px;background:var(--stage-3);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere;animation:rise .4s .2s both}
.sign{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.sign .paper{width:200px}
.sgn{display:grid;gap:6px}
.sgn .chip{animation:slideIn .4s both;animation-delay:calc(var(--d)*.3s + 1.2s)}
.ctres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:40px}
.tgls{display:grid;gap:8px}
.tgl{display:flex;align-items:center;gap:10px;text-align:left;background:var(--stage-3);border:1.5px solid var(--stage-line);border-radius:10px;padding:10px 12px;font-weight:700;color:var(--stage-ink)}
.tgl i{width:20px;height:20px;border-radius:6px;border:2px solid var(--stage-mut);flex:none}
.tgl[aria-pressed="true"]{border-color:var(--s-teal)}
.tgl[aria-pressed="true"] i{background:var(--s-teal);border-color:var(--s-teal)}
.lane .tr i{display:flex}
/* Celular: sem escala — a página rola, mas compacta para o polegar.
   HUD numa linha, mapa em lista, placar numa linha, botões largos. */
@media (max-width:560px){
  body{font-size:15px}
  .hud-in{gap:10px;padding-block:8px;flex-wrap:nowrap}
  .mission{flex:1 1 auto}
  .code{display:none}
  .mission b{font-size:17px}
  .player{flex:0 0 auto;gap:8px}
  .pl-txt{display:none}
  .lvl,.lvl svg{width:36px;height:36px}
  .lvl span{font-size:16px}
  .xpnum{font-size:16px}
  .wrap{padding-top:12px;gap:12px}
  .stage{border-radius:16px;padding:16px;min-height:0}
  .scr{gap:16px}
  .maphero h1,.brief h1{font-size:38px}
  .maphero .row .btn{flex:1 1 auto;padding:12px 14px}
  .tiles{grid-template-columns:1fr;gap:8px}
  .tile{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;gap:0 12px;align-items:center;padding:10px 12px;border-radius:14px}
  .tile .tic{grid-column:1;grid-row:1/span 2;width:40px;height:40px}
  .tile .tn{grid-column:2;grid-row:1}
  .tile b{grid-column:2;grid-row:2;font-size:18px}
  .tile .tf{grid-column:3;grid-row:1/span 2;margin:0;flex-direction:column;align-items:flex-end;gap:4px}
  .tile:hover:not([disabled]){transform:none}
  .mapfoot{flex-direction:column;align-items:stretch}
  .brief{gap:18px}
  .brief>.donut,.brief>.medal{display:none}
  .intro{font-size:16px}
  .rw{padding:8px 12px}
  .rw b{font-size:18px}
  .brief .row .btn{width:100%}
  .daybox b{font-size:40px}
  .stx{padding:18px}
  .stx-h .n{font-size:36px}
  .stx p{font-size:16px}
  .vig{min-height:220px;padding:16px 12px}
  .ctl .btn{flex:1}
  .bhead h2{font-size:28px}
  .ginst{font-size:15px}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:6px}
  .stat{min-width:0;padding:5px 8px}
  .stat small{font-size:10px;letter-spacing:.04em}
  .stat b{font-size:20px}
  .card{font-size:17px;padding:12px}
  .dcard{min-height:120px;padding:16px}
  .banner .row .btn{flex:1 1 auto}
  .qtxt{font-size:26px}
  .opt{min-height:60px;padding:12px 14px;font-size:16px}
  .expl p{font-size:16px}
  .expl .btn{width:100%}
  .res{gap:18px}
  .res .medal{width:170px}
  .res h2{font-size:36px}
  .rstats .stat b{font-size:24px}
  .res .row .btn{flex:1 1 auto}
  .guide{gap:10px}
  .gcard{padding:14px}
  .lvup{padding:10px 16px;white-space:normal;width:calc(100vw - 32px)}
  .lvup b{font-size:20px}
  .chkl .okb{top:-20px;right:6px}
  .chkl{margin-top:8px}
}

<script>
/* ================= Helpers de vinheta ================= */
const ic=(id,cls='i',st='')=>`<svg class="${cls}"${st?` style="${st}"`:''}><use href="#${id}"/></svg>`;
const ch=a=>a.map((f,i)=>`<span class="chip ${f[1]||''}" style="--d:${i}">${f[0]}</span>`).join('');
const pad=n=>String(n).padStart(2,'0');
function vf(icon,big,facts=[],tone='',req){
  const head=icon.length===1?icon:ic(icon);
  return `<div class="vf"><div class="vf-ico ${tone}">${head}</div><div class="vf-big">${big}</div>${facts.length?`<div class="vf-facts">${ch(facts)}</div>`:''}${req?`<div class="vf-facts req">${ch(req)}</div>`:''}</div>`;
}
const vForm=(title,code,line)=>`<div class="paper form"><h5>${title} <span>${code}</span></h5>
<div class="fl">Material<i class="f" style="--d:0;width:100%"></i></div><div class="fl">Qtd<i class="f" style="--d:1;width:40%"></i></div>
<div class="fl">Centro<i class="f" style="--d:2;width:55%"></i></div><div class="fl">Data nec.<i class="f" style="--d:3;width:70%"></i></div>
<div class="fl">Justificativa<i class="f" style="--d:4;width:85%"></i></div><div style="margin-top:8px;font-weight:700">${line} <span class="caret"></span></div></div>`;
const vAppr=(doc,code,stamp,who,whoIc='i2',bad)=>`<div class="appr"><div class="who"><i>${ic(whoIc)}</i>${who}</div>
<div class="paper"><h5>${doc} <span>${code}</span></h5><div class="fl">Material<i style="width:100%"></i></div><div class="fl">Qtd<i style="width:40%"></i></div><div class="fl">Centro<i style="width:55%"></i></div></div>
<div class="stamp ${bad?'bad':''}">${stamp}</div></div>`;
const vProps=(list)=>`<div class="props">${list.map((p,i)=>`<div class="paper prop ${p[3]?'late':''}" style="--r:${(i-(list.length-1)/2)*6}deg;--d:${i}"><small>${p[0]}</small><b>${p[1]}</b><small>${p[2]}</small>${p[3]?`<br><span class="ltag">${p[3]}</span>`:''}</div>`).join('')}</div>`;
const vQQP=()=>`<div class="paper qqp"><h5>QQP · mesma base <span>custo total</span></h5>
<div class="bar" style="--d:0"><b>A</b><i style="width:82%"></i><span>R$ 8.760</span></div>
<div class="bar win" style="--d:1"><b>B</b><i style="width:52%"></i><span>R$ 8.300</span></div>
<div class="bar" style="--d:2"><b>C</b><i style="width:100%"></i><span>R$ 9.040</span></div><span class="wtag">✓ Vencedor: B</span></div>`;
const vPC=()=>`<div class="pcwrap"><div class="paper pc"><h5>PC 4500012345 <span>ME21N</span></h5><div style="font-family:var(--f-display);font-size:24px;font-weight:700">R$ 8.300</div><svg class="sig" viewBox="0 0 190 34"><path d="M6 24c10-16 18-18 20-8s-6 14 2 8 14-20 18-12-4 14 6 10 10-14 18-10 2 10 12 6 16-8 30-6 30 2 46 0"/></svg></div>
<div><div class="ladder">${[1,2,3,4,5,6,7].map(n=>`<div class="rung ${n<=2?'go':''}" style="--d:${n-1}">N${n}</div>`).join('')}</div><div class="lnote">≤ R$ 10 mil</div></div></div>`;
const vSend=(ok)=>`<div class="send"><div class="paper pcm"><h5 style="font-size:13px">PC</h5><div class="fl" style="grid-template-columns:1fr"><i style="width:100%"></i></div><div class="fl" style="grid-template-columns:1fr"><i style="width:60%"></i></div></div>
<div class="path"></div><div class="plane">${ic('i6','i','width:32px;height:32px')}</div><div class="bld">${ic('ifac')}<span class="okb">✓ ${ok}</span></div></div>`;
const vRoad=(m)=>`<div class="road">${m.map((t,i)=>`<div class="mile" style="left:${18+i*32}%;--d:${i}"><i></i>${t}</div>`).join('')}<div class="ln"></div><div class="truck">${ic('i7')}</div></div>`;
const vWH=(t)=>`<div class="wh"><div class="box"></div><div class="house"><svg class="i" viewBox="0 0 24 18"><path d="M1 7 12 1l11 6v10H1z"/><path d="M7 17v-6h10v6"/></svg></div><span class="okb">✓ ${t}</span></div>`;
const vStop=()=>`<div class="belt"><div class="secs"><i></i><i></i><i class="gap"></i><i></i><i></i><i></i></div><div class="rail"></div><span class="okb bad">⚠ Linha parada: falta material</span></div>`;
const vPillars=()=>`<div class="pillars">${[['Conformidade',150],['Rastreabilidade',170],['Eficiência',130]].map((p,i)=>`<div class="pil" style="--d:${i}"><i style="height:${p[1]}px"></i>${p[0]}</div>`).join('')}</div>`;
const vScope=()=>`<div class="scope"><div class="ends"><span class="chip t">RM · ME51N</span><span class="chip o">PC encerrado</span></div><div class="line"></div>
<div class="ppl">${[['iusers','Requisitante'],['i2','Gestor'],['icoin','Comprador'],['iladder','Aprovadores'],['i8','Almoxarifado']].map((p,i)=>`<span style="--d:${i}"><i>${ic(p[0])}</i>${p[1]}</span>`).join('')}</div></div>`;
const vNoPC=()=>`<div class="nopc"><div class="trk">${ic('i7')}</div><div class="ghost">PC?</div><div class="stamp bad">PROIBIDO</div><span class="okb">Exceção: Carta de Intenção prévia</span></div>`;
const vSap=()=>`<div class="sap"><div class="docs"><div class="paper" style="--d:0">PC</div><div class="paper" style="--d:1">Contrato</div></div>${ic('ir','i','transform:rotate(90deg);color:var(--stage-mut)')}<div class="sbox">SAP</div></div>`;
const vRace=()=>`<div class="race"><div class="lane p"><span>Padrão</span><div class="tr"><i>15 dias úteis</i></div></div><div class="lane u"><span>Urgente</span><div class="tr"><i>2,5 dias</i></div></div></div>`;
const vOne=()=>`<div class="one"><div class="paper prop" style="--r:0deg;--d:0"><small>Fornecedor X</small><b>R$ 3.480</b><small>entrega amanhã</small></div><span class="okb">✓ 1 proposta válida</span></div>`;
const vLate=()=>`<div class="lateset">${vProps([['Fornecedor A','R$ 8.760','no prazo'],['Fornecedor B','R$ 8.300','no prazo'],['Fornecedor C','R$ 9.040','2 dias depois','atrasada']])}</div>`;
const vLaudo=()=>`<div class="laudo"><div class="paper"><h5>Vencedor <span>QQP</span></h5><b style="font-family:var(--f-display);font-size:22px">Fornecedor C</b><br><small style="color:var(--paper-mut);font-weight:600">não é o menor custo</small></div>${ic('ir','i','color:var(--stage-mut)')}<div class="paper att"><h5>Laudo técnico <span>PC</span></h5><div class="fl" style="grid-template-columns:1fr"><i class="f" style="--d:0;width:100%"></i></div><div class="fl" style="grid-template-columns:1fr"><i class="f" style="--d:1;width:70%"></i></div><div style="margin-top:8px;font-weight:700;color:var(--paper-teal)">✓ Justificado</div></div></div>`;
const LADDER=[['N1','Coordenador de Suprimentos'],['N2','Ger. Suprimentos e Planejamento'],['N3','Gerente Financeiro'],['N4','Diretor Geral'],['N5','Conselho AG · D2 ou D3'],['N6','Conselho AG · D4/D5/D6'],['N7','Presidente da Unidade']];
const vLadder=(n)=>`<div class="ladder wide">${LADDER.map((r,i)=>`<div class="rung ${i<n?'go':''} ${i===n-1?'top':''}" style="--d:${i}">${r[0]}<em>${r[1]}</em></div>`).join('')}</div>`;
const vIcons=(l)=>`<div class="icons">${l.map((x,i)=>`<div class="icn" style="--d:${i}">${ic(x[0])}${x[1]}</div>`).join('')}</div>`;
const WEIGHTS=[['Custo',10],['Entrega',20],['Atendimento',20],['Qualidade',10],['Meio ambiente',10],['Saúde e Segurança',10],['Resp. social',10],['Conduta ética',10]];
const WCOL=['var(--s-blue)','var(--s-orange)','var(--s-orange)','var(--s-teal)','var(--s-blue)','var(--s-teal)','var(--s-blue)','var(--s-teal)'];
function vWeights(){
  const R=70,C=2*Math.PI*R;let a=-90,s='';
  WEIGHTS.forEach((w,i)=>{const len=C*w[1]/100-3;s+=`<circle class="arc" cx="100" cy="100" r="${R}" stroke="${WCOL[i]}" stroke-dasharray="${len} ${C}" style="--len:${len};--d:${i}" transform="rotate(${a} 100 100)"/>`;a+=3.6*w[1]});
  return `<div class="wts"><svg viewBox="0 0 200 200" aria-label="Pesos dos 8 critérios">${s}<text x="100" y="108" text-anchor="middle" style="font-family:var(--f-display);font-weight:700;font-size:34px;fill:var(--stage-ink)">100%</text></svg>
  <div class="wlist">${WEIGHTS.map((w,i)=>`<span style="--d:${i}"><em style="font-style:normal"><i style="background:${WCOL[i]}"></i>${w[0]}</em><b>${w[1]}%</b></span>`).join('')}</div></div>`;
}
function heroDonut(){
  const R=78,C=2*Math.PI*R,parts=[[2,'var(--s-teal)','Aprovação'],[8,'var(--s-blue)','Cotação + QQP'],[3,'var(--s-orange)','PC'],[2,'var(--s-teal)','Envio']];
  let a=-90,s=`<svg viewBox="-40 -10 280 220" aria-label="15 dias úteis: 2 aprovação, 8 cotação e QQP, 3 PC, 2 envio">`;
  parts.forEach((p,i)=>{const len=C*p[0]/15-4;
    s+=`<circle class="arc" cx="100" cy="100" r="${R}" stroke="${p[1]}" stroke-dasharray="${len} ${C}" style="--len:${len};--d:${i}" transform="rotate(${a} 100 100)"/>`;
    const mid=(a+360*p[0]/15/2)*Math.PI/180,lx=100+(R+38)*Math.cos(mid),ly=100+(R+38)*Math.sin(mid);
    s+=`<text class="dl" x="${lx}" y="${ly+5}" text-anchor="${Math.cos(mid)>0.2?'start':Math.cos(mid)<-0.2?'end':'middle'}"><tspan class="n">${p[0]}</tspan> ${p[2]}</text>`;a+=360*p[0]/15});
  return `<div class="donut">${s}</svg><div class="center"><b>15</b><small>dias úteis</small></div></div>`;
}

/* ================= Widgets interativos ================= */
const fmtR=v=>v>=1e6?'R$ '+(v/1e6).toFixed(v<1e7?1:0).replace('.',',').replace(',0','')+' mi':'R$ '+(v>=1e4?Math.round(v/1000):(v/1000).toFixed(1).replace('.',',').replace(',0',''))+' mil';
const W={
  cot(el){
    el.innerHTML=`<div class="wg"><div class="wg-top"><label for="cotV">Valor do pedido</label><b id="cotOut"></b></div>
    <input type="range" id="cotV" min="500" max="20000" step="100" value="4000" aria-label="Valor do pedido">
    <label class="tg"><input type="checkbox" id="cotU"> Urgente / line-down</label>
    <div class="slots3">${[0,1,2].map(()=>`<span>${ic('i1')}</span>`).join('')}</div><div class="wg-res" id="cotRes"></div></div>`;
    const v=el.querySelector('#cotV'),u=el.querySelector('#cotU');
    const up=()=>{const x=+v.value,n=u.checked?1:x<=2500?1:x<=5000?2:3;
      el.querySelector('#cotOut').textContent='R$ '+x.toLocaleString('pt-BR');
      el.querySelectorAll('.slots3 span').forEach((s,i)=>s.classList.toggle('on',i<n));
      el.querySelector('#cotRes').innerHTML=`Mínimo: <em>${n} cotaç${n>1?'ões':'ão'}</em>`};
    v.oninput=up;u.onchange=up;up();
  },
  alc(el){
    el.innerHTML=`<div class="wg"><div class="wg-top"><label for="alcV">Valor do PC</label><b id="alcOut"></b></div>
    <input type="range" id="alcV" min="0" max="1000" step="1" value="450" aria-label="Valor do PC">
    <div class="alc"><div class="wg-res" id="alcRes" style="text-align:left"></div><div class="ladder wide" id="alcL">${LADDER.map(r=>`<div class="rung">${r[0]}<em>${r[1]}</em></div>`).join('')}</div></div></div>`;
    const v=el.querySelector('#alcV');
    const up=()=>{let x=Math.pow(10,3+4*v.value/1000);const p=Math.pow(10,Math.floor(Math.log10(x))-1);x=Math.round(x/p)*p;
      const n=x<=1e4?2:x<=6e4?3:x<=3e6?4:x<=5e6?5:x<=6e6?6:7;
      el.querySelector('#alcOut').textContent=fmtR(x);
      el.querySelectorAll('#alcL .rung').forEach((r,i)=>{r.classList.toggle('go',i<n);r.classList.toggle('top',i===n-1)});
      el.querySelector('#alcRes').innerHTML=`Sobe até <em>N${n}</em><br><span style="font-size:17px;color:var(--stage-mut)">${LADDER[n-1][1]}</span>`};
    v.oninput=up;up();
  },
  aval(el){
    const def=[90,70,80,100,100,100,100,100];
    el.innerHTML=`<div class="aval"><div class="crit">${WEIGHTS.map((w,i)=>`<label for="cr${i}">${w[0]}<small id="crv${i}">${def[i]}%</small><input type="range" id="cr${i}" min="0" max="100" step="5" value="${def[i]}"></label>`).join('')}</div>
    <div class="score"><b id="avS">0</b><span class="verdict" id="avV"></span><small id="avC"></small></div></div>`;
    const up=()=>{let s=0;WEIGHTS.forEach((w,i)=>{const v=+el.querySelector('#cr'+i).value;el.querySelector('#crv'+i).textContent=v+'%';s+=w[1]*v/100});
      s=Math.round(s);el.querySelector('#avS').textContent=s+'%';
      const V=s>=80?['p','Positivo','Continua fornecendo']:s>=60?['r','Regular','Continua, com justificativa']:['n','Negativo','Plano de ação + NC em 3 meses'];
      const e=el.querySelector('#avV');e.className='verdict '+V[0];e.textContent=V[1];el.querySelector('#avC').textContent=V[2]};
    el.querySelectorAll('input').forEach(i=>i.oninput=up);up();
  }
};


/* ================= Vinhetas extras (contratos e serviços) ================= */
const vLanes=(l)=>`<div class="race">${l.map((x,i)=>`<div class="lane"><span>${x[0]}</span><div class="tr"><i style="width:${x[2]}%;min-width:86px;background:${x[3]};color:${x[4]||'#0A1A33'};animation:grow ${x[5]||1.2}s .3s linear both">${x[1]}</i></div></div>`).join('')}</div>`;
const vChecklist=(title,items,miss,okT,badT)=>`<div class="chkl paper"><h5>${title} <span>${miss<0?'completo':'pendente'}</span></h5><ul>${items.map((t,i)=>`<li class="${i===miss?'no':''}" style="--d:${i}"><i>${i===miss?'✕':'✓'}</i>${t}</li>`).join('')}</ul><span class="okb ${miss<0?'':'bad'}">${miss<0?okT:badT}</span></div>`;
const vFolder=(path,items)=>`<div class="fold"><div class="fold-ic">${ic('ifold')}</div><code class="mono">${path}</code><div class="vf-facts">${ch(items.map(t=>[t,'']))}</div></div>`;

W.contrato=function(el){
  el.innerHTML=`<div class="wg"><div class="wg-top"><label for="ctV">Valor do serviço</label><b id="ctVo"></b></div><input type="range" id="ctV" min="5000" max="200000" step="1000" value="45000" aria-label="Valor do serviço">
  <div class="wg-top"><label for="ctD">Duração</label><b id="ctDo"></b></div><input type="range" id="ctD" min="5" max="365" step="5" value="90" aria-label="Duração em dias">
  <label class="tg"><input type="checkbox" id="ctT"> Envolve terceirização de mão de obra</label><div class="ctres" id="ctR"></div></div>`;
  const v=el.querySelector('#ctV'),d=el.querySelector('#ctD'),t=el.querySelector('#ctT');
  const up=()=>{const x=+v.value,y=+d.value,need=x>30000&&y>30,pct=x>50000?10:5;
    el.querySelector('#ctVo').textContent='R$ '+x.toLocaleString('pt-BR');el.querySelector('#ctDo').textContent=y+' dias';
    el.querySelector('#ctR').innerHTML=need?`<span class="verdict p">Precisa de contrato</span><span class="chip o">Multa de ${pct}% · R$ ${(x*pct/100).toLocaleString('pt-BR')}</span>${t.checked?'<span class="chip t">Cláusula de garantia</span>':''}`
      :`<span class="verdict r">Basta o PC</span><span class="chip">Contrato só acima de R$ 30 mil e 30 dias</span>`};
  v.oninput=up;d.oninput=up;t.onchange=up;up();
};
W.aval5=function(el){
  const C=['Custo','QMSS','Prazo de entrega','Atendimento','Conduta ética'],st=[1,1,1,0,1];
  el.innerHTML=`<div class="aval"><div class="tgls">${C.map((c,i)=>`<button type="button" class="tgl" id="av5${i}" aria-pressed="${!!st[i]}"><i></i>${c}</button>`).join('')}</div><div class="score"><b id="a5S"></b><span class="verdict" id="a5V"></span><small id="a5C"></small></div></div>`;
  const up=()=>{const n=st.reduce((a,b)=>a+b,0),p=n*20;el.querySelector('#a5S').textContent=p+'%';
    const V=p>=80?['p','Positivo','Continua sem justificativa']:p>=60?['r','Regular','Continua com justificativa']:['n','Negativo','Plano de ação ou desqualificação'];
    const e=el.querySelector('#a5V');e.className='verdict '+V[0];e.textContent=V[1];el.querySelector('#a5C').textContent=V[2]};
  C.forEach((_,i)=>{const b=el.querySelector('#av5'+i);b.onclick=()=>{st[i]=st[i]?0:1;b.setAttribute('aria-pressed',!!st[i]);up()}});up();
};

(function(){
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const QS=new URLSearchParams(location.search);
const NM=M.length;
const KEY=CFG.key+(QS.get('usuario')?'-'+QS.get('usuario'):'');
/* Integração: envia eventos para a página que incorpora a trilha (ex.: SISTEN via iframe) */
const notify=(evento,dados)=>{try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({origem:CFG.origem,evento,usuario:QS.get('usuario')||null},dados),'*')}catch(e){}};
let P={best:{},stars:{},done:{},review:false,name:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)P=Object.assign(P,s)}catch(e){}
if(QS.get('nome'))P.name=QS.get('nome');if(QS.get('revisao')==='1')P.review=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const starsHTML=(n,cls='stars')=>`<div class="${cls}">${[0,1,2].map(k=>`<svg class="${k<n?'on':''}" style="--d:${k}" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>`).join('')}</div>`;
const gain=k=>15+5*Math.min(k-1,4);
const gMax=m=>{const N=m.game.type==='order'?m.scenes.length:m.game.cards.length;let s=0;for(let k=1;k<=N;k++)s+=gain(k);return s};

/* ---------- XP e nível ---------- */
const LV=CFG.levels;
let R=null;
function total(){let t=0;for(const k in P.best){if(R&&+k===R.m.n)continue;t+=P.best[k]}if(R)t+=Math.max(P.best[R.m.n]||0,R.xp);return t}
const lvlOf=x=>{let i=0;LV.forEach((l,k)=>{if(x>=l[0])i=k});return i};
const doneCount=()=>M.filter(m=>P.done[m.n]).length;
const nextMission=()=>{for(const m of M)if(!P.done[m.n])return m.n;return 0};
const unlocked=n=>P.review||n===1||!!P.done[n-1]||!!P.done[n];
let shownXP=null,lastLvl=null;
function hud(){
  const x=total(),i=lvlOf(x),lo=LV[i][0],hi=LV[i+1]?LV[i+1][0]:lo+1000,k=Math.min(1,(x-lo)/(hi-lo));
  $('xpFill').style.width=(k*100)+'%';$('lvlRing').style.strokeDashoffset=119.4*(1-k);
  $('lvlN').textContent=i+1;$('lvlName').textContent='Nível '+(i+1)+' · '+LV[i][1];
  const from=shownXP==null?x:shownXP;shownXP=x;
  if(RM||from===x)$('xpN').textContent=x;
  else{const t0=performance.now();(function f(t){const q=Math.min(1,(t-t0)/700);$('xpN').textContent=Math.round(from+(x-from)*q);if(q<1)requestAnimationFrame(f)})(t0)}
  if(lastLvl!=null&&i>lastLvl)levelUp(i);lastLvl=i;
  const now=R?R.m.n:nextMission();
  let s='<svg viewBox="0 0 322 40" role="img" aria-label="Torre do curso">';
  const sw=286/NM,dh=12/NM;
  for(let j=0;j<NM;j++){const x0=j*sw,h0=26-j*dh,h1=26-(j+1)*dh,c=P.done[j+1]?'done':(j+1===now?'now':'');
    s+=`<path class="tb-seg ${c}" d="M${x0} ${20-h0/2}L${x0+sw-2} ${20-h1/2}V${20+h1/2}L${x0} ${20+h0/2}Z"><title>Missão ${j+1}</title></path>`}
  s+='<rect x="288" y="14" width="18" height="12" rx="3" fill="var(--navy)"/><g class="rotor" style="transform-origin:306px 20px"><line x1="306" y1="20" x2="306" y2="3"/><line x1="306" y1="20" x2="320.7" y2="28.5"/><line x1="306" y1="20" x2="291.3" y2="28.5"/></g></svg>';
  $('towerbar').innerHTML=s;
  $('badges').innerHTML=M.map(m=>`<svg class="hex ${P.done[m.n]?'on':''}" viewBox="0 0 22 24"><title>${m.badge}</title><path d="M11 1 21 6.5v11L11 23 1 17.5v-11z"/></svg>`).join('');
}
function levelUp(i){
  const b=document.createElement('div');b.className='lvup';
  b.innerHTML=`${ic('iaward')}<div><span>Subiu de nível</span><br><b>Nível ${i+1} · ${LV[i][1]}</b></div>`;
  document.body.appendChild(b);setTimeout(()=>b.remove(),3300);burst(innerWidth/2,120);
}
function addXP(n,el){
  R.xp+=n;
  if(el){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='xpf';d.textContent='+'+n+' XP';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
  hud();
}

/* ---------- Medalha ---------- */
function medal(m,locked){
  const rays=Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<path d="M100 100 L${100+100*Math.cos(a-.12)} ${100+100*Math.sin(a-.12)} L${100+100*Math.cos(a+.12)} ${100+100*Math.sin(a+.12)}Z"/>`}).join('');
  return `<div class="medal ${locked?'locked':''}"><svg viewBox="0 0 200 200" role="img" aria-label="Insígnia ${m.badge}">${locked?'':`<g class="rays">${rays}</g>`}<g class="core"><path class="hexo" d="M100 22 168 61v78l-68 39-68-39V61z"/><path class="hexi" d="M100 38 154 69v62l-54 31-54-31V69z"/><svg class="gl" x="70" y="58" width="60" height="60" viewBox="0 0 24 24"><use href="#${m.ic}"/></svg><text class="mlbl" x="100" y="146">MISSÃO ${pad(m.n)}</text></g></svg></div>`;
}

function bigTower(){

  for(let i=0;i<NM;i++){const yb=base-i*(h+g),yt=yb-h,w=t=>28-12*((base-t)/(NM*(h+g))),c=P.done[i+1]?'done':(i+1===nd?'next':'');
    s+=`<path class="bt-seg ${c}" d="M${60-w(yb)} ${yb}L${60-w(yt)} ${yt}H${60+w(yt)}L${60+w(yb)} ${yb}Z"/><text class="bt-num" x="98" y="${yb-h/2+4}">${pad(i+1)}</text>`}
  const top=base-NM*(h+g)+g;
  s+=`<rect x="48" y="${top-14}" width="26" height="12" rx="3" fill="var(--s-blue)"/><g class="rotor" style="transform-origin:58px ${top-8}px"><line x1="58" y1="${top-8}" x2="58" y2="${top-40}"/><line x1="58" y1="${top-8}" x2="85.7" y2="${top+8}"/><line x1="58" y1="${top-8}" x2="30.3" y2="${top+8}"/></g></svg>`;

function placeToken(){

  const tr=st.parentElement.getBoundingClientRect(),r=st.getBoundingClientRect();

function wSet(i){
  const m=R.m,n=m.scenes.length,s=m.scenes[i];R.wi=i;

  const v=document.createElement('div');v.className='vig';sc.appendChild(tx);sc.appendChild(v);
  if(s.widget)W[s.widget](v);else v.innerHTML=typeof s.vig==='function'?s.vig():s.vig;
  $('roLeft').innerHTML=s.doc?`<svg class="docmini" viewBox="0 0 38 46" aria-hidden="true"><path d="M1 1h26l10 10v34H1z"/><text x="19" y="32">${s.doc}</text></svg><div><div class="k">Documento</div><div class="v">${s.st}</div></div>`
    :`<span class="stico">${ic(s.ic)}</span><div><div class="k">Cena ${i+1} de ${n}</div><div class="v">${R.m.short}</div></div>`;
  const db=$('dayBox');
  if(s.k===undefined)db.hidden=true;
  else{db.hidden=false;$('dayL').textContent=s.kl||'';const b=$('dayN');
    if(typeof s.k==='number'&&!RM){const from=shownK,to=s.k,t0=performance.now();(function f(t){const q=Math.min(1,(t-t0)/600);b.textContent=pad(Math.round(from+(to-from)*q));if(q<1)requestAnimationFrame(f)})(t0);shownK=to}
    else{b.textContent=typeof s.k==='number'?pad(s.k):s.k;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(typeof s.k==='number')shownK=s.k}}

function wIcon(p){$('wPlayI').setAttribute('href',p?'#ipa':'#ip');$('wPlay').setAttribute('aria-label',p?'Pausar':'Reproduzir');document.body.classList.toggle('fast',p)}
function wPlay(){const n=R.m.scenes.length;if(R.wi>=n-1)wSet(0);wIcon(true);wSched()}

/* ---------- Encaixe na janela (embutida) ---------- */
const FIT=window.parent!==window,LARG=1220;let FS=1,fitRaf=0;
function encaixar(){
  const box=$('fitbox'),f=$('fit'),W=innerWidth,H=innerHeight,on=FIT&&W>=760;
  document.documentElement.classList.toggle('fit',on);
  if(!on){FS=1;f.style.cssText='';box.style.cssText='';document.documentElement.classList.remove('fit-rola');return}
  f.style.transform='none';f.style.minHeight='0';f.style.width=LARG+'px';
  let s=Math.min(W/LARG,H/f.scrollHeight,1.5);
  f.style.width=(W/s)+'px';
  s=Math.max(.6,Math.min(s,H/f.scrollHeight));f.style.width=(W/s)+'px';
  const natural=f.scrollHeight;
  f.style.minHeight=(H/s)+'px';f.style.transform=`scale(${s})`;FS=s;
  const alto=Math.max(H,natural*s);
  box.style.width=W+'px';box.style.height=alto+'px';
  document.documentElement.classList.toggle('fit-rola',alto>H+1);
  if(cur==='watch')placeToken();
}
const reencaixar=()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(encaixar)};
addEventListener('resize',reencaixar);
if(FIT&&window.ResizeObserver)new ResizeObserver(reencaixar).observe($('fit'));


/* ---------- Fase 2: Jogo ---------- */
const gHead=(t,inst)=>`<div class="bhead"><div style="display:grid;gap:8px"><div class="kick">Fase 2</div><h2>${t}</h2><p class="ginst">${inst}</p></div>
  <div class="stats"><div class="stat"><small>Acertos</small><b id="gOk">0</b></div><div class="stat"><small>Erros</small><b id="gErr">0</b></div>
  <div class="stat combo" id="gComboBox"><small>Combo</small><b id="gCombo">x0</b></div><div class="stat"><small>Tempo</small><b id="gTime">0:00</b></div></div></div>`;
function gStats(){const g=R.g;$('gOk').textContent=g.ok+'/'+g.N;$('gErr').textContent=g.err;$('gCombo').textContent='x'+g.combo}
function gTick(){const g=R.g;clearInterval(g.tick);if(g.done)return;g.tick=setInterval(()=>{const s=Math.floor((performance.now()-g.t0)/1000);const e=$('gTime');if(e)e.textContent=Math.floor(s/60)+':'+pad(s%60)},500)}
function gHit(el){const g=R.g;g.combo++;g.max=Math.max(g.max,g.combo);g.ok++;addXP(gain(g.combo),el);
  const cb=$('gComboBox');cb.classList.remove('hot');void cb.offsetWidth;if(g.combo>1)cb.classList.add('hot');gStats()}
function gMiss(el){const g=R.g;g.err++;g.combo=0;gStats();el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}
function enterGame(){
  if(R.g){gTick();return}
  const m=R.m;
  if(m.game.type==='order'){
    const N=m.scenes.length;let order=[...Array(N).keys()];do{order=shuffle(order)}while(order.every((v,i)=>v===i));
    R.g={type:'order',N,next:0,ok:0,err:0,combo:0,max:0,t0:performance.now(),done:false};
    $('s-game').innerHTML=gHead(m.game.title,GINST.order)+`<ol class="slots" id="slots">${m.scenes.map((_,i)=>`<li class="slot ${i===0?'next':''}" id="sl${i}">${i+1}</li>`).join('')}</ol>
      <div class="pool">${order.map(i=>`<button class="card" type="button" data-i="${i}">${ic(m.scenes[i].ic)}<span>${m.scenes[i].t}</span></button>`).join('')}</div><div id="gEnd"></div>`;
    document.querySelectorAll('#s-game .card').forEach(c=>c.onclick=()=>{
      const g=R.g,i=+c.dataset.i;if(g.done)return;
      if(i===g.next){gHit(c);c.classList.add('used');const sl=$('sl'+i);sl.className='slot full';sl.innerHTML=ic(m.scenes[i].ic)+`<span>${m.scenes[i].t}</span>`;
        g.next++;if(g.next<N)$('sl'+g.next).classList.add('next');if(g.next===N)gFinish()}
      else gMiss(c)});
  }else{
    const cards=m.game.cards,N=cards.length,glob=!m.game.cards[0].b;
    R.g={type:'deck',N,order:shuffle([...Array(N).keys()]),i:0,ok:0,err:0,combo:0,max:0,tries:0,t0:performance.now(),done:false,lock:false,glob,bins:glob?m.game.buckets.map(()=>[]):null};
    $('s-game').innerHTML=gHead(m.game.title,GINST.deck)+`<div class="deck"><div class="dleft" id="dLeft"></div><div id="dCard"></div><div class="bkts" id="bkts"></div></div><div id="gEnd"></div>`;
    dRender();
  }
  gStats();gTick();
}
function dRender(){
  const g=R.g,m=R.m,c=m.game.cards[g.order[g.i]],bs=c.b||m.game.buckets;
  $('dLeft').textContent=`Carta ${g.i+1} de ${g.N}`;
  $('dCard').innerHTML=`<div class="dcard" id="dc">${c.s?`<small>${c.s}</small>`:''}<b>${c.t}</b></div>`;
  if(!g.glob||!$('bkts').children.length){
    $('bkts').innerHTML=bs.map((b,k)=>`<button class="bkt" type="button" data-k="${k}"><b>${b}</b>${g.glob?`<span class="cnt">${g.bins[k].length}</span><span class="mini">${g.bins[k].map(t=>`<i>${t}</i>`).join('')}</span>`:''}</button>`).join('');
    $('bkts').dataset.n=bs.length;
    document.querySelectorAll('.bkt').forEach(b=>b.onclick=()=>dPick(+b.dataset.k,b));
  }
  document.querySelectorAll('.bkt').forEach(b=>b.classList.remove('hint','bad','hit'));
}
function dPick(k,btn){
  const g=R.g;if(g.done||g.lock)return;const c=R.m.game.cards[g.order[g.i]];
  if(k===c.a){gHit(btn);g.lock=true;
    if(g.glob){g.bins[k].push(c.t);btn.querySelector('.cnt').textContent=g.bins[k].length;btn.querySelector('.mini').insertAdjacentHTML('beforeend',`<i>${c.t}</i>`);btn.classList.remove('hit');void btn.offsetWidth;btn.classList.add('hit')}

    setTimeout(()=>{g.lock=false;g.i++;g.tries=0;if(g.i>=g.N){$('dCard').innerHTML='';$('dLeft').textContent='Todas as cartas classificadas';gFinish()}else dRender()},RM?0:340);
  }else{gMiss(btn);const d=$('dc');d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad');
    if(++g.tries>=2)document.querySelectorAll('.bkt')[c.a].classList.add('hint')}
}
function gFinish(){
  const g=R.g;g.done=true;clearInterval(g.tick);R.done.game=true;markPhases();
  const s=g.err===0?3:g.err<=2?2:1;g.stars=s;
  $('gEnd').innerHTML=`<div class="banner"><div style="display:grid;gap:6px"><h3>${s===3?'Perfeito':'Fase concluída'}</h3><div class="row">${starsHTML(s)}<span class="chip">${g.err} erro${g.err===1?'':'s'}</span><span class="chip">combo x${g.max}</span><span class="chip">${$('gTime').textContent}</span></div></div>

  $('gAgain').onclick=()=>{R.g=null;enterGame()};
  const r=$('gEnd').getBoundingClientRect();burst(r.left+r.width/2,r.top+20);
